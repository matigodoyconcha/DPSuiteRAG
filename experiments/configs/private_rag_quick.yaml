method: private_rag

# Quick smoke config for MURAG (fixed threshold). Small corpus, few queries, a
# single light model — verifies the budget-aware retrieval + Alg.7 generation
# end-to-end. See private_rag.yaml for the full paper-faithful sweep.

dataset:
  name: squad          # answer-bearing contexts (loader seeds index with each query's gold context)
  max_index_docs: 200  # small smoke corpus

llm:
  name: huggingface
  model_name: Qwen/Qwen2.5-1.5B-Instruct   # ~1.5B, fits a 16 GB GPU

models:
  embedder: sentence-transformers/all-MiniLM-L6-v2   # light single-tower embedder for the smoke

private_rag:
  variant: murag
  M: 1
  m: 8                  # few voters for a fast smoke
  k: 1
  epsilon_0: 2.0
  vote_threshold: null  # => m/2 = 4
  t_max: 16
  threshold: 0.2        # cosine scale for all-MiniLM
  exclude_stopwords: false
  random_seed: 42
  use_chat_template: auto

epsilon_q_values: [5, 10]
k_retrieved: 8          # m*k

metrics:
  utility: [match_accuracy, contains_accuracy, rouge_l, f1_score]
  privacy: [mia_auc_bleu]

output_dir: results/private_rag_quick/
max_queries: 20
verbose: true
verbose_max_examples: 3
