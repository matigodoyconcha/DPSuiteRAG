method: private_rag

# Quick smoke config for MURAG-ADA (adaptive threshold). Mirrors
# private_rag_quick.yaml but with variant: murag_ada and the threshold-release
# budget/bin knobs. See private_rag_ada.yaml for the full paper-faithful sweep.

dataset:
  name: squad
  max_index_docs: 200

llm:
  name: huggingface
  model_name: Qwen/Qwen2.5-1.5B-Instruct

models:
  embedder: sentence-transformers/all-MiniLM-L6-v2

private_rag:
  variant: murag_ada
  M: 1
  m: 8
  k: 1
  epsilon_0: 2.0
  vote_threshold: null   # => m*k/2 = 4
  t_max: 16
  epsilon_thr: 1.0
  score_min: 0.0
  score_max: 1.0
  bin_size: 0.05         # cosine scale for all-MiniLM
  exclude_stopwords: false
  random_seed: 42
  use_chat_template: auto

epsilon_q_values: [5, 10]   # both > eps_thr (1.0)
k_retrieved: 8

metrics:
  utility: [match_accuracy, contains_accuracy, rouge_l, f1_score]
  privacy: [mia_auc_bleu]

output_dir: results/private_rag_ada_quick/
max_queries: 20
verbose: true
verbose_max_examples: 3
