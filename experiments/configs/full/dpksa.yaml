method: dpksa

# === Datasets (paper §6.1) ===========================================
# Tang et al. (arXiv:2602.14374) evaluate DP-KSA on TWO QA benchmarks:
# Natural Questions (NQ) and TriviaQA (TQA). Both retrieve from the FULL
# Wikipedia corpus (~21M passages, §6.1) and use a 100-question subset per
# dataset (questions with empty ground-truth references filtered out).
#
# The runner now iterates over this `datasets:` list and sets the per-dataset
# corpus size from `max_index_docs` (each entry may also set `max_test_queries`,
# else it falls back to the top-level `max_queries`).
# NOTE (corpus size): the paper retrieves from the FULL Wikipedia corpus
# (~21M passages, §6.1), which is infeasible to index locally. `max_index_docs`
# is therefore a tractable stand-in; raise it toward the paper corpus at the cost
# of indexing time/memory. `max_test_queries` = paper's 100-question subset.
datasets:
  - name: natural_questions   # NQ [Kwiatkowski et al. 2019]; paper corpus = ~21M Wikipedia passages
    max_index_docs: 20000     # large but feasible corpus (full = null)
    max_test_queries: 40      # ~2x runtime (was 20; paper uses 100)
  - name: triviaqa            # TQA [Joshi et al. 2017]; paper corpus = ~21M Wikipedia passages
    max_index_docs: 20000     # large but feasible corpus (full = null)
    max_test_queries: 40      # ~2x runtime (was 20; paper uses 100)
  # --- harmonized additions (same 6 datasets across all methods) ---
  - name: searchqa
    max_index_docs: 20000
    max_test_queries: 40
  - name: chatdoctor
    max_index_docs: 20000
    max_test_queries: 40
  - name: medical_dirichlet_phi3
    max_index_docs: 20000
    max_test_queries: 40
  - name: movielens             # recommendation task; scored by match here (no hit_rate in this runner)
    max_index_docs: 20000
    max_test_queries: 40

# Singular fallback block, used only when the `datasets:` list above is removed.
dataset:
  name: natural_questions

llm:
  name: huggingface
  # Faithful to paper §6.1 generators (user accepts OOM risk; departs from the
  # prior shared small-model choice, e.g. distilgpt2). Paper evaluates THREE
  # instruction-tuned generators; primary = Qwen2.5-3B-Instruct. Others:
  #   - meta-llama/Llama-3.2-3B-Instruct
  #   - meta-llama/Llama-3.1-8B-Instruct
  model_name: Qwen/Qwen2.5-3B-Instruct

# All three paper generators (swept like datasets; one run per LLM).
llms:
  # Harmonized sweep: every method runs the SAME ≤4B LLMs.
  # 8B excluded (does not fit the 15.47 GiB GPU). Gated repos (gemma-2-2b-it,
  # Llama-3.2-3B-Instruct) self-skip with a [WARN] unless the user has HF access
  # + huggingface-cli login.
  - model_name: facebook/opt-1.3b                  # 1.3B base
  - model_name: EleutherAI/pythia-1.4b             # 1.4B base
  - model_name: google/gemma-2-2b-it               # 2B instruct (gated)
  - model_name: Qwen/Qwen2.5-3B-Instruct           # 3B instruct (dpksa paper primary)
  - model_name: meta-llama/Llama-3.2-3B-Instruct   # 3B instruct (gated)
  - model_name: microsoft/Phi-3.5-mini-instruct    # 3.8B instruct
  - model_name: microsoft/Phi-4-mini-instruct      # 3.8B instruct

models:
  # Standardized retriever across all methods (arctic-embed-m-v1.5): one strong modern
  # embedder removes the retriever as a confound in the cross-method comparison
  # (fairness > per-paper faithfulness). Single-tower, cosine (vectors L2-normalised).
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5

dpksa:
  n_docs: 80              # N = ensemble size / top-N retrieved (paper §6.1: 80, optimal per ablation §6.3.2)
  max_answer_tokens: 16   # per-document response length (paper T_max not given numerically; benchmark default)
  max_final_tokens: 32    # final keyword-conditioned answer (paper does not fix; benchmark default)
  k_min: 15               # DPKSA-03: paper Alg.3 restricts the FindBestK window to [15,30]
  k_max: 30               # (r(k)=-inf outside). Public utility knob, privacy-neutral; was [1,79].
  ptr_delta_fraction: 0.5 # share of delta reserved for the PTR false-release (paper splits delta; fraction not given)
  ptr_noise_coupling: 0.25  # DPKSA-05: sigma = coupling * gumbel_scale. At 1.0 the PTR
                            # threshold (~Phi^-1(1-d)*2*sigma) was so large the test almost
                            # never passed -> degenerated to zero-shot. 0.25 roughly halves
                            # the threshold across the eps sweep (better pass-rate at eps>=3);
                            # the larger Gumbel scale it induces is tolerable now that k is
                            # restricted to [15,30] (DPKSA-03). Privacy unchanged (calibration
                            # still hits the target eps, enforced by the upper-bound guard).
  lowercase: true
  exclude_stopwords: false  # DPKSA-08: the paper does NOT remove stopwords, and exclusion
                            # does not remove the real offenders (scaffold words) — those are
                            # handled at the source by the chat template + _strip_scaffold
                            # (DPKSA-01). Knob kept for ablations; was true.
  random_seed: 42
  # C2: chat template for instruct models (auto) so per-doc responses answer instead
  # of echoing the Instruction/Context/Question/Answer scaffold into the histogram.
  use_chat_template: auto
  # C3 (opt-in, OFF by default): stop strings to truncate per-call output, e.g.
  # ["\nKeywords:", "\nQuestion:"]. null disables it.
  stop_strings: null

epsilon_values: [1, 2, 3, 5, 8]   # paper §5 Settings sweep
delta: 1.0e-4                      # paper §5 Settings: delta = 1e-4
k_retrieved: 80                   # = n_docs (N)

metrics:
  # Paper §6.1 metrics: F1, ROUGE-1, ROUGE-L, normalized Levenshtein (DPKSA-13, all
  # now implemented). match_accuracy/contains_accuracy kept as the cross-method
  # headline. Only metrics computable from predictions/references are listed.
  utility: [match_accuracy, contains_accuracy, rouge_l, rouge_1, levenshtein, f1_score, bert_score_f1, perplexity]
  privacy: []  # MIA is a separate run: python experiments/runner.py --mia-only

output_dir: results/dpksa/
max_queries: 40    # ~2x runtime (was 20; paper uses 100)
verbose: true
verbose_max_examples: 5

# The privacy unit is one corpus document, and the reported epsilon is a
# document-level guarantee. Splitting a document into c chunks and protecting a
# single chunk only reaches the document through group privacy, which costs
# (c*eps, c*exp((c-1)*eps)*delta): the delta grows exponentially in c, so at five
# chunks and eps=1 a delta of 1e-5 has already degraded past 1e-3 and the
# document-level statement is worth nothing.
#
# Set enabled: true only for a corpus whose documents are already short enough to
# be one privacy unit each, or for a run that deliberately accepts the
# degradation (metrics.workload_accounting.group_privacy gives the correction).
chunking:
  enabled: false
  chunk_size: 256   # words per chunk (used only when enabled: true)
  overlap: 32       # overlapping words between consecutive chunks (enabled: true only)
