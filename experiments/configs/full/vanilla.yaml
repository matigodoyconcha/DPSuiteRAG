method: vanilla

# Datasets evaluated by the non-private reference condition. Each entry is merged
# over the singular `dataset:` block below, which supplies the defaults, so an entry
# may override the corpus size, the query count or any loader filter. The same list
# drives the standalone MIA baseline (python experiments/runner.py --mia-only).
datasets:
  - name: chatdoctor
  - name: natural_questions
  - name: triviaqa
  - name: medical_dirichlet_phi3
  - name: searchqa
  - name: movielens

# Membership inference attack settings (used only under --mia-only). n_per_class is
# capped automatically when a dataset has fewer usable documents; raise the dataset's
# max_index_docs / max_test_queries for larger, more stable samples.
mia:
  enabled: true
  # Same as the DP methods (mia_probe.py default): comparing a leakage ceiling
  # measured on 50+50 targets against AUCs measured on 100+100 compares two sample
  # sizes, not two mechanisms.
  n_per_class: 100
  index_size: 2000
  seed: 42
  anderson_doc_maxlen: 512

dataset:
  # demo | squad | chatdoctor | natural_questions | triviaqa | hotpotqa | searchqa | movielens
  name: squad

  # Como separar indexado y test
  index_split: train
  test_split: validation
  # Same corpus and same query count as the DP configs. The baseline is the reference
  # every DP curve is read against, so a smaller corpus here would put part of the gap
  # between them down to how much each side had to retrieve from.
  max_index_docs: 20000
  max_test_queries: 40

  # If you want to control exactly the index documents and test queries,
  # you can use local files and skip the HuggingFace dataset:
  # docs_path: data/index_docs.jsonl
  # queries_path: data/test_queries.jsonl
  docs_path:
  queries_path:

llm:
  # name funciona como selector del proveedor/model loader, igual que dataset.name
  name: huggingface
  # Defaults to the first entry of `llms:` below. tiny-gpt2 is a 2-layer stub with
  # random weights: as the non-private reference every DP curve is read against, it
  # measured nothing. Keep it only for a smoke run.
  model_name: facebook/opt-1.3b

# The same generators the DP configs sweep, so the reference condition and the curves
# it anchors differ in the privacy mechanism and not in the model.
llms:
  - model_name: facebook/opt-1.3b
  - model_name: microsoft/Phi-3.5-mini-instruct    # 3.8B instruct
  - model_name: meta-llama/Llama-3.2-3B-Instruct
  - model_name: Qwen/Qwen2.5-3B-Instruct

models:
  # Standardized retriever across all methods (arctic-embed-m-v1.5): one strong modern
  # embedder removes the retriever as a confound in the cross-method comparison
  # (fairness > per-paper faithfulness). Single-tower, cosine (vectors L2-normalised).
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5

pipeline:
  # 50, matching the vote-based methods and Private-RAG. At 2 the reference condition
  # retrieved a twenty-fifth of what the curves it anchors do, so the gap between them
  # measured retrieval depth as much as privacy.
  k_retrieved: 50

generation:
  max_new_tokens: 30
  # C2: apply the model's chat template when it has one (auto). No-op for base models.
  use_chat_template: auto
  # C3 (opt-in, OFF by default): stop strings to truncate the answer before scoring,
  # e.g. ["\nQuestion:", "\nContext:"]. null disables it.
  stop_strings: null

random_seed: 42
output_path: results/vanilla/vanilla_squad.json

# The privacy unit is one corpus document, and the reported epsilon is a
# document-level guarantee. Splitting a document into c chunks and protecting a
# single chunk only reaches the document through group privacy, which costs
# (c*eps, c*exp((c-1)*eps)*delta): the delta grows exponentially in c, so at five
# chunks and eps=1 a delta of 1e-5 has already degraded past 1e-3 and the
# document-level statement is worth nothing.
#
# Set enabled: true only for a corpus whose documents are already short enough to
# be one privacy unit each, or for a run that deliberately accepts the
# degradation (metrics.workload_accounting.group_privacy gives the correction).
chunking:
  enabled: false
  chunk_size: 256   # words per chunk (used only when enabled: true)
  overlap: 32       # overlapping words between consecutive chunks (enabled: true only)
  # Cap on the words of a single indexed document. One document stays one entry and
  # one privacy unit; the cap only bounds how long a prompt built from it can get.
  # A corpus of whole documents has a long tail (MovieLens user profiles reach ~4800
  # words, about 7k tokens) and the voting methods feed m documents into one prompt,
  # which overruns a 2048-position model outright and strains larger ones.
  max_document_words: 400
