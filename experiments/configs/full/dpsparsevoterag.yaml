method: dpsparsevoterag

# --- Datasets (Koga et al., arXiv:2412.04697v3, §IV-A) ---
# The paper evaluates DPSparseVoteRAG on TriviaQA, Natural Questions and
# ChatDoctor, with 100 test questions per dataset. For NQ/TriviaQA the corpus is
# the Wikipedia passage collection (DPR-style); the paper does NOT fix a small
# global #docs — it filters to questions with 20-59 ground-truth relevant docs
# and retrieves the m*k most relevant per query. For ChatDoctor the corpus is
# "the remaining QA pairs" (all minus the 100 test questions). The per-dataset
# #docs below records this faithful corpus intent.
#
# The runner now iterates over this `datasets:` list and sets the per-dataset
# corpus size from `max_index_docs` (each entry may also set `max_test_queries`,
# else it falls back to the top-level `max_queries`). NOTE: NQ/TriviaQA use the
# full Wikipedia DPR corpus in the paper (20-59 relevant docs/query); the values
# here are tractable stand-ins — raise them to approach the paper corpus at the
# cost of indexing time/memory.
datasets:
  # Both retrieve from the full DPR psgs_w100 corpus, the one the paper uses. They
  # name the same corpus, so a run evaluating both embeds it once. Retrieval takes a
  # fixed top-m, so the corpus size changes which documents win, not how many.
  - name: triviaqa            # 100 test queries; Wikipedia passages, 20-59 relevant docs/query
    max_index_docs: null      # full DPR psgs_w100 (~21M passages), as in the paper
  - name: natural_questions   # 100 test queries; Wikipedia passages, 20-59 relevant docs/query
    max_index_docs: null      # full DPR psgs_w100 (~21M passages), as in the paper
  - name: chatdoctor          # 100 patient questions; corpus = remaining QA pairs
    max_index_docs: 20000     # large but feasible corpus (full = null)
  # --- harmonized additions (same 6 datasets across all methods) ---
  - name: searchqa
    max_index_docs: 20000
    max_test_queries: 40
  - name: medical_dirichlet_phi3
    max_index_docs: 20000
    max_test_queries: 40
  - name: movielens             # recommendation task; scored by match here (no hit_rate in this runner)
    max_index_docs: 20000
    max_test_queries: 40

# Singular fallback block, used only when the `datasets:` list above is removed.
dataset:
  name: natural_questions

llm:
  name: huggingface
  # Paper primary generator (§IV-A, OPT 1.3B = "left column" main results).
  # NOTE: departs from the prior shared small-model choice (dpvoterag.yaml uses
  # distilgpt2, the _quick variant opt-350m); OOM risk accepted by the user.
  model_name: facebook/opt-1.3b

# All paper generators (swept like datasets; one run per LLM).
llms:
  # Harmonized sweep: every method runs the SAME ≤4B LLMs.
  # 8B excluded (does not fit the 15.47 GiB GPU). Gated repos (gemma-2-2b-it,
  # Llama-3.2-3B-Instruct) self-skip with a [WARN] unless the user has HF access
  # + huggingface-cli login.
  - model_name: facebook/opt-1.3b                  # 1.3B base (dpsparsevoterag paper primary)
  - model_name: Qwen/Qwen2.5-3B-Instruct           # 3B instruct
  - model_name: meta-llama/Llama-3.2-3B-Instruct   # 3B instruct (gated)
  - model_name: microsoft/Phi-3.5-mini-instruct    # 3.8B instruct

models:
  # Standardized retriever across all methods (arctic-embed-m-v1.5): one strong modern
  # embedder removes the retriever as a confound in the cross-method comparison
  # (fairness > per-paper faithfulness). Single-tower, cosine (vectors L2-normalised).
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5

dpsparsevoterag:
  # The reference implementation cuts each context document at its first "//"
  # (Koga et al., eval_rag_generator.py). On SearchQA snippets and ChatDoctor entries,
  # which contain URLs, that truncates mid-content -- and only this method and MuRAG
  # inherit it, so two of the eight would read a shorter context than the other six
  # get from the same corpus. Off here, on in paper_faithful/.
  truncate_at_double_slash: false
  m: 50                  # voters; paper DPSparseVoteRAG OPT-1.3B main results use 50 (README: --n_split 50)
  k: 1                   # one relevant document per voter (paper k=1)
  # Derived from the cell's own budget: epsilon_token = epsilon_total / max_private_tokens.
  # See dpvoterag.yaml — with it derived, epsilon_token_values no longer names curves
  # and only its first entry is used.
  epsilon_token_from_budget: true
  epsilon_token: 2       # fallback when epsilon_token_from_budget is false
                         # Per-token budget (LD + SVT), split by sparse_fraction below.
                         # =2 -> LD 1.0 + SVT 1.0 per release == paper README (--dp_eps 1 --sparse_eps 1).
                         # The per-query epsilon_total the cell derives stays the ONLINE CAP.
  sparse_fraction: 0.5   # fraction of the per-token budget (= of epsilon_total) reserved for the SVT
                         # threshold/Laplace; LD-Gumbel gets the rest (paper §3.3: eps_token/2 each)
  # Derived, not pinned: delta_token = share * delta_axis / (Q * max_private_tokens),
  # so the additive delta the mechanism spends over the workload is the same mass in
  # every cell rather than growing with Q. See dpvoterag.yaml for the full argument.
  delta_token_from_workload: true
  delta_token: 1.0e-6    # fallback when delta_token_from_workload is false.
                         # Aligned with dpvoterag so the additive mass over the workload
                         # (c=30 releases x Q=100) fits the common 1e-2 target: 3e-3.
                         # See dpvoterag.yaml: this also sets the Limited-Domain bottom-out
                         # threshold. Here the Gumbel step gets only half of epsilon_token,
                         # so the effect is worse -- measured at 2e-9, essentially every
                         # query halts on its first private token at epsilon_token=1.
                         # The cost of a smaller value is on the release side, not the budget
                         # side: the LD-Gumbel bottom-out offset goes 25.4 -> 30.0 votes out of
                         # 50 at epsilon_token=1, and since release probability is logistic in
                         # (votes - offset)/2 there, a token backed by 26 voters drops from 0.57
                         # to 0.12 and one backed by 30 from 0.91 to 0.50.
  k_bar: 50              # reduced LD domain = number of voters m (paper: "k_bar = number of voters")
  threshold: 25          # SVT agreement threshold tau = m/2 = 25 (paper README: --threshold 25 with m=50)
  tmax_absolute: 30      # DPSPARSE-04: the shared answer length, and the generation-length
                         # ceiling (ref --max_length 50). The private-release counter c
                         # (paper Alg.3 line 25) and the online budget check stop generation
                         # earlier; this bounds an all-public answer as well.
  # Equal to the full answer length. Not every token this method emits is
  # private -- the sparse test routes the rest to a public, budget-free path -- so a
  # ceiling below tmax_absolute hands it free tokens that DPVoteRAG, which pays for
  # all 30, does not get. Matching the two makes the private budget the comparable
  # quantity and leaves the sparse test deciding which tokens are private, rather
  # than a config constant deciding how many can be.
  max_private_tokens: 30  # private-release ceiling `c` (paper Alg.3 line 25): cap on the number of
                          # private (LD) token releases per answer. It is also the divisor the
                          # derived per-token budget uses (epsilon_token = epsilon_total / c),
                          # so the cell's whole allowance is spread over exactly these releases.
                          # epsilon_total is the real stopping cap; this just bounds how many
                          # private releases can happen.
  exclude_stopwords: true         # exclude stopwords (privacy-neutral; the excluded set is
                                  # public/data-independent). Stops the public token from
                                  # emitting stopword boilerplate for free, improving utility.
  exclude_question_words: false   # paper does NOT exclude question words from the mechanism
  stopwords_path: data/stopword_words.pt  # stopword token ids loaded from here
  random_seed: 42
  # C2: chat template for instruct models (auto) so each voter / public token answers
  # instead of echoing the scaffold. No-op for base models. Enables testing any LLM.
  use_chat_template: auto
  # C3 (opt-in, OFF by default): stop strings to truncate the answer, e.g. ["\nQuestion:"].
  stop_strings: null

epsilon_token_values: [1, 2, 5]      # paper §IV-A per-token budgets epsilon_token in {1, 2, 5} (each split
                                     # epsilon_token/2 for LD-Gumbel + epsilon_token/2 for SVT per §3.3; the
                                     # reference README's --dp_eps 1 --sparse_eps 1 is the epsilon_token=2
                                     # configuration). While epsilon_token_from_budget is true the list
                                     # collapses to one curve and the value itself is unused, the per-token
                                     # budget coming from the cell's own allowance instead; the paper's
                                     # curve set is kept here for a run that turns the derivation off.
# NOT a free knob: this delta feeds the mechanism, not only the report. With
# delta_token at the paper's value, delta_total=1e-5 leaves T_max=1 -- one token
# per answer. The common delta=1e-2 of the protocol is a WORKLOAD figure computed
# by metrics.workload_accounting from each method's real parameters; it is not the
# same quantity as the per-query target a mechanism calibrates against, and forcing
# the two to be equal disables the method rather than making it more private.
delta_total: 1.0e-2    # The generator's own online (eps, delta) budget for ONE query, and
                       # INERT as this file stands: it is read only when
                       # `delta_token_from_workload` is false, and it is true above. Editing
                       # this number changes nothing about a run of this config; the runner
                       # derives the guard per cell as 2 * T * delta_token instead. It is
                       # kept, rather than deleted, as the value the pinned-delta path uses
                       # -- flip the flag and this is the guard.
                       # Deriving it makes the guard track what one query's releases actually
                       # spend instead of standing at a fixed number. Pinned at the axis
                       # delta it is vacuous -- at Q=100 a
                       # query spends a hundredth of it and nothing can ever trip it --
                       # while any value below delta_token refuses every release and leaves
                       # every answer empty for a reason no privacy parameter shows. What
                       # the workload is CHARGED is Q * T * delta_token = share * delta_axis,
                       # derived above and independent of this ceiling, so epsilon stays the
                       # binding constraint and the sweep moves in noise per vote.
k_retrieved: 50                     # m*k retrieved docs/query (paper retrieves m*k most relevant); m=50,k=1

metrics:
  # Full, consistent metric set across all methods. contains_accuracy is the
  # paper's "match accuracy". Only metrics computable from predictions/
  # references are listed.
  utility: [match_accuracy, contains_accuracy, rouge_l, f1_score, bert_score_f1, perplexity]
  privacy: []  # MIA is a separate run: python experiments/runner.py --mia-only

output_dir: results/dpsparsevoterag/
max_queries: 40         # ~2x runtime (was 20; paper uses 100)
verbose: true
verbose_max_examples: 3

# The privacy unit is one corpus document, and the reported epsilon is a
# document-level guarantee. Splitting a document into c chunks and protecting a
# single chunk only reaches the document through group privacy, which costs
# (c*eps, c*exp((c-1)*eps)*delta): the delta grows exponentially in c, so at five
# chunks and eps=1 a delta of 1e-5 has already degraded past 1e-3 and the
# document-level statement is worth nothing.
#
# Set enabled: true only for a corpus whose documents are already short enough to
# be one privacy unit each, or for a run that deliberately accepts the
# degradation (metrics.workload_accounting.group_privacy gives the correction).
chunking:
  enabled: false
  chunk_size: 256   # words per chunk (used only when enabled: true)
  overlap: 32       # overlapping words between consecutive chunks (enabled: true only)
  # Cap on the words of a single indexed document. One document stays one entry and
  # one privacy unit; the cap only bounds how long a prompt built from it can get.
  # A corpus of whole documents has a long tail (MovieLens user profiles reach ~4800
  # words, about 7k tokens) and the voting methods feed m documents into one prompt,
  # which overruns a 2048-position model outright and strains larger ones.
  max_document_words: 400

# Points on the SHARED axis, crossed with the workload sizes below. The runner
# derives this method's own budget knob for each (target, Q) pair via
# metrics.workload_accounting.budget_for_target, so a target and the value that
# implements it cannot drift apart.
epsilon_targets: [1, 3, 5, 10, 50]

# Workload sizes the same run is priced for. Q is a property of the guarantee, not of
# the measurement: every cell answers the same questions, and Q only sets how much
# budget each one gets. A method that pays per query has to spend less on each as the
# stream grows; one whose guarantee already covers the stream does not move, and that
# contrast is what the sweep measures.
workload_queries: [1, 5, 25, 100]
