method: private_rag

# === Private-RAG / MURAG (Wu et al., arXiv:2511.07637) ================
# Multi-query DP-RAG. A per-document individual privacy filter (E(z) = M*eps_q)
# makes accumulated privacy loss depend on how often each document is retrieved,
# not on the number of queries. This config is the MURAG variant (fixed public
# relevance threshold); private_rag_ada.yaml is the MURAG-ADA variant (only the
# retrieval differs). Headline guarantee: epsilon = M*eps_q, pure DP (delta = 0).

# --- Datasets (paper §4: Natural Questions, TriviaQA, MQuAKE, ChatDoctor) ---
# The paper uses NQ/TriviaQA (100 questions each, ~20M Wikipedia passages), MQuAKE
# (400 correlated multi-hop questions) and ChatDoctor (100 patient questions, corpus
# = remaining ~200K QA pairs). MQuAKE is not in this repo; the harmonized 6-dataset
# set (shared across all methods) is used instead, with a tractable corpus size.
datasets:
  - name: natural_questions   # paper dataset; corpus = ~20M Wikipedia passages
    max_index_docs: 20000     # tractable stand-in (full = null)
    max_test_queries: 40      # paper uses 100
  - name: triviaqa            # paper dataset
    max_index_docs: 20000
    max_test_queries: 40
  - name: chatdoctor          # paper dataset; corpus = remaining QA pairs
    max_index_docs: 20000
    max_test_queries: 40
  # --- harmonized additions (same 6 datasets across all methods) ---
  - name: searchqa
    max_index_docs: 20000
    max_test_queries: 40
  - name: medical_dirichlet_phi3
    max_index_docs: 20000
    max_test_queries: 40
  - name: movielens
    max_index_docs: 20000
    max_test_queries: 40

# Singular fallback block, used only when the `datasets:` list above is removed.
dataset:
  name: natural_questions

llm:
  name: huggingface
  # Paper §4 generators: OPT-1.3B, Pythia-1.4B, Mistral-7B. Primary here = OPT-1.3B.
  model_name: facebook/opt-1.3b

# All paper generators are swept like datasets (one run per LLM). Harmonized ≤4B
# sweep shared across methods; Mistral-7B is excluded (does not fit the GPU). Gated
# repos self-skip with a [WARN] unless the user has HF access + huggingface-cli login.
llms:
  - model_name: facebook/opt-1.3b                  # 1.3B base (paper primary)
  - model_name: EleutherAI/pythia-1.4b             # 1.4B base (paper)
  - model_name: google/gemma-2-2b-it               # 2B instruct (gated)
  - model_name: Qwen/Qwen2.5-3B-Instruct           # 3B instruct
  - model_name: meta-llama/Llama-3.2-3B-Instruct   # 3B instruct (gated)
  - model_name: microsoft/Phi-3.5-mini-instruct    # 3.8B instruct
  - model_name: microsoft/Phi-4-mini-instruct      # 3.8B instruct

models:
  # Standardized retriever across all methods (arctic-embed-m-v1.5): one strong modern
  # embedder removes the retriever as a confound in the cross-method comparison
  # (fairness > per-paper faithfulness). Single-tower, cosine (vectors L2-normalised).
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5

private_rag:
  variant: murag         # MURAG (fixed public threshold). MURAG-ADA -> private_rag_ada.yaml
  M: 1                   # max retrievals per document (paper main results: M=1, conservative).
                         # Headline epsilon = M*eps_q. With M=1 a document serves at most one query.
  m: 50                  # voters in the Alg.7 subroutine (matches DPSparseVoteRAG; paper k in {30,40,50})
  k: 1                   # documents per voter (retrieved = m*k)
  epsilon_0: 2.0         # per-token budget (paper eps_token in {0.5,1,2}); eps_Lap=eps_Expo=eps_0/2, c=floor(eps/eps_0).
                         # Single-value fallback used only when top-level epsilon_0_values is absent (which takes precedence).
  vote_threshold: null   # SVT vote threshold theta (null => m/2 = 25, "half the m voters")
  t_max: 50              # max decoding steps per answer
  # MURAG fixed public relevance threshold tau (cosine scale). PUBLIC & data-independent
  # (no DP cost): docs scoring above tau are charged eps_q and eligible for the Top-K.
  # MEASURED on whole documents (chatdoctor, 20k, arctic-embed-m-v1.5, the 40 test
  # questions of this config). The chunked profile above no longer holds, and 0.6 is
  # now far past starvation:
  #
  #   tau    docs above tau/query (mean/median)   queries < m*k=50   queries with 0
  #   0.4    1547 / 1170                           2/40               0
  #   0.5     108 /   51                          20/40               2
  #   0.6     2.2 /    0                          40/40              23/40
  #   0.7     0.0 /    0                          40/40              40/40
  #
  # With no documents the generator takes its no-RAG branch and answers from the model
  # alone: MURAG silently stops being a RAG method, and the only trace is
  # n_docs_retrieved: 0. But 0.4 is not the answer either -- it charges 7.7% of the
  # corpus per query, which at M=1 spends out the corpus's relevant region in about
  # 13 queries. There is no threshold that fills 50 voters without burning the budget;
  # that tension is a property of MURAG at this corpus size and belongs in the write-up
  # rather than in a tuned constant. Re-measure per dataset with
  # scripts/calibrate_tau.py and record BOTH numbers (voters filled, documents charged).
  threshold: 0.5
  exclude_stopwords: false  # paper ExpoMech is over the FULL vocabulary; keep it faithful (off)
  exclude_question_words: false
  stopwords_path: data/stopword_words.pt
  random_seed: 42
  use_chat_template: auto   # chat template for instruct models (no-op for base models)
  stop_strings: null

# Per-query budget sweep (paper §4.2). Headline epsilon = M*eps_q (M=1 => eps=eps_q);
# the paper's "eps ~ 10" operating point is eps_q=10, M=1.
epsilon_q_values: [2, 5, 10, 15, 20, 30, 40]
# Paper Appendix E per-token grid. One result file per (eps_q, eps_0) cell; the paper
# reports the best-over-grid performance per eps_q point (selection at analysis time).
epsilon_0_values: [0.5, 1.0, 2.0]
k_retrieved: 50           # m*k documents handed to the subroutine

metrics:
  # match_accuracy = paper "prediction contains any correct answer"; BERTScore-F1 for
  # ChatDoctor. Only metrics computable from predictions/references are listed.
  utility: [match_accuracy, contains_accuracy, rouge_l, f1_score, bert_score_f1, perplexity]
  privacy: []  # MIA is a separate run: python experiments/runner.py --mia-only

output_dir: results/private_rag/
max_queries: 40
verbose: true
verbose_max_examples: 3

# The privacy unit is one corpus document, and the reported epsilon is a
# document-level guarantee. Splitting a document into c chunks and protecting a
# single chunk only reaches the document through group privacy, which costs
# (c*eps, c*exp((c-1)*eps)*delta): the delta grows exponentially in c, so at five
# chunks and eps=1 a delta of 1e-5 has already degraded past 1e-3 and the
# document-level statement is worth nothing.
#
# Set enabled: true only for a corpus whose documents are already short enough to
# be one privacy unit each, or for a run that deliberately accepts the
# degradation (metrics.workload_accounting.group_privacy gives the correction).
chunking:
  enabled: false
  chunk_size: 256   # words per chunk (used only when enabled: true)
  overlap: 32       # overlapping words between consecutive chunks (enabled: true only)
  # Cap on the words of a single indexed document. One document stays one entry and
  # one privacy unit; the cap only bounds how long a prompt built from it can get.
  # A corpus of whole documents has a long tail (MovieLens user profiles reach ~4800
  # words, about 7k tokens) and the voting methods feed m documents into one prompt,
  # which overruns a 2048-position model outright and strains larger ones.
  max_document_words: 400
