method: dpvoterag

# ----------------------------------------------------------------------------
# Paper-faithful configuration for DPVoteRAG.
# Source: Koga et al., "Privacy-Preserving Retrieval-Augmented Generation with
# Differential Privacy", arXiv:2412.04697v3; official repo tacchan7412/DPRAG.
# ----------------------------------------------------------------------------

# --- Datasets (paper §experiments) -------------------------------------------
# The paper evaluates DPVoteRAG on three datasets, each with a subset of
# 100 test questions (arXiv:2412.04697v3: "we use a subset of 100 questions").
#   - triviaqa / natural_questions: external corpus = Wikipedia (DPR passages).
#     Test questions are filtered to >=20 relevant docs, then split into 4 bins
#     (20-29, 30-39, 40-49, 50-59 relevant docs) sampling 25 questions per bin.
#     => the per-query retrieved corpus size ranges 20-59 docs (paper §exp).
#   - chatdoctor: external corpus = remaining ChatDoctor QA pairs (not Wikipedia);
#     "The external dataset consists of the remaining QA pairs from the original
#     ChatDoctor dataset, excluding the 100 patient questions used for testing."
#
# The runner now (a) iterates over this `datasets:` list, running every entry,
# and (b) sets the per-dataset corpus size from `max_index_docs`. Each entry may
# also set `max_test_queries` (falls back to the top-level `max_queries` below).
# NOTE: NQ/TriviaQA use the full Wikipedia DPR corpus in the paper; the values
# here are tractable stand-ins (per-query relevant docs span 20-59). Raise them
# to approach the paper corpus at the cost of indexing time/memory.
datasets:
  # Both retrieve from the full DPR psgs_w100 corpus, the one the paper uses. They
  # name the same corpus, so a run evaluating both embeds it once. Retrieval takes a
  # fixed top-m, so the corpus size changes which documents win, not how many.
  - name: triviaqa          # primary dataset (paper's main hyperparameter table)
    max_index_docs: null    # full DPR psgs_w100 (~21M passages), as in the paper
  - name: natural_questions
    max_index_docs: null    # full DPR psgs_w100 (~21M passages), as in the paper
  - name: chatdoctor
    max_index_docs: 20000   # large but feasible corpus (full = null)
  # --- harmonized additions (same 6 datasets across all methods) ---
  - name: searchqa
    max_index_docs: 20000
    max_test_queries: 40
  - name: medical_dirichlet_phi3
    max_index_docs: 20000
    max_test_queries: 40
  - name: movielens             # recommendation task; scored by match here (no hit_rate in this runner)
    max_index_docs: 20000
    max_test_queries: 40

# Singular fallback block, used only when the `datasets:` list above is removed.
dataset:
  name: triviaqa

# --- Models (paper-faithful; departs from prior shared small-model choice) ---
# The paper's primary generator is OPT (1.3B); it also reports Llama 3.1 (8B)
# and Pythia (1.4B). We pin OPT-1.3B as the faithful primary (user accepts OOM
# risk). NOTE: this replaces the previous small distilgpt2 used for portability.
llm:
  name: huggingface
  model_name: facebook/opt-1.3b   # paper primary generator (also: meta-llama/Llama-3.1-8B, EleutherAI/pythia-1.4b)

# All paper generators (swept like datasets; one run per LLM).
llms:
  # Harmonized sweep: every method runs the SAME ≤4B LLMs.
  # 8B excluded (does not fit the 15.47 GiB GPU). Gated repos (gemma-2-2b-it,
  # Llama-3.2-3B-Instruct) self-skip with a [WARN] unless the user has HF access
  # + huggingface-cli login.
  - model_name: facebook/opt-1.3b                  # 1.3B base (dpvoterag paper primary)
  - model_name: Qwen/Qwen2.5-3B-Instruct           # 3B instruct
  - model_name: meta-llama/Llama-3.2-3B-Instruct   # 3B instruct (gated)
  - model_name: microsoft/Phi-3.5-mini-instruct    # 3.8B instruct

models:
  # Standardized retriever across all methods (arctic-embed-m-v1.5): one strong modern
  # embedder removes the retriever as a confound in the cross-method comparison
  # (fairness > per-paper faithfulness). Single-tower, cosine (vectors L2-normalised).
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5

dpvoterag:
  # The reference implementation cuts each context document at its first "//"
  # (Koga et al., eval_rag_generator.py). On SearchQA snippets and ChatDoctor entries,
  # which contain URLs, that truncates mid-content -- and only this method and MuRAG
  # inherit it, so two of the eight would read a shorter context than the other six
  # get from the same corpus. Off here, on in paper_faithful/.
  truncate_at_double_slash: false
  m: 50                # voters; paper OPT-1.3B main results use 50 (README: --n_split 50)
  k: 1                 # docs per voter; paper: "each voter receives 1 relevant document, i.e., k=1"
  # Derived, not pinned: epsilon_token = epsilon_total / max_length, so the budget a
  # cell derives from epsilon_targets IS the query's whole allowance and every point of
  # the sweep releases the same number of tokens. Pinned at 2.0 the budget instead
  # decided the answer length, confounding length with privacy.
  # paper_faithful/ keeps the paper's fixed value and its own sweep.
  epsilon_token_from_budget: true
  epsilon_token: 2     # fallback when epsilon_token_from_budget is false
  # Derived, not pinned: delta_token = share * delta_axis / (Q * max_length), so the
  # additive delta the mechanism spends over the workload (Q * T * delta_token) is the
  # SAME mass in every cell. Held at a constant instead, that mass grows with Q — a
  # hundredth of it at Q=1 and all of it at Q=100 — so two cells reported at one common
  # delta were not paying the same price for it, and the shorter workload silently got
  # the stricter guarantee. `share` is metrics.workload_accounting.MECHANISM_DELTA_SHARE;
  # the rest of the axis delta is left to the RDP -> (eps, delta) conversion, which
  # cannot run without slack. paper_faithful/ keeps the pinned value below.
  delta_token_from_workload: true
  delta_token: 1.0e-6  # fallback when delta_token_from_workload is false.
                       # This value is NOT free to move: it also sets the Limited-Domain
                       # Gumbel bottom-out threshold (generator.py h_perp += log(./delta)/eps),
                       # so shrinking it makes the mechanism decline to answer rather
                       # than answer more privately. Measured at 2e-9: tokens with 10/50
                       # voter agreement go from 3% to 93% failure, and one failure ends
                       # the generation -- empty predictions, BERTScore NaN. It also buys
                       # nothing: T_max is identical at both values across the whole
                       # epsilon sweep, because epsilon binds and delta does not.
                       # The workload cost is real and is reported rather than hidden:
                       # over T tokens and Q queries this contributes T*Q*delta_token of
                       # additive mass (3e-3 at T=30, Q=100), which is what
                       # metrics.workload_accounting composes and reports. The derived
                       # form above spends share*delta_axis = 5e-3 at every workload size
                       # instead, which is the point of deriving it.
  k_bar: 50            # paper: "set their parameter k_bar to be the number of voters" (= m)
  compose_method: simple  # DPVOTE-01: paper-faithful accounting = max(advanced, sequential)
                          # (footnote 4, Alg.2). 'rdp' is the reference RUNTIME default but
                          # drives Tmax->0 at low eps (empty answers); 'simple' matches the
                          # method written in the paper.
  tmax_absolute: null  # optional safety ceiling on top of max_length; null => none.
  max_length: 30       # DPVOTE-09: fixed generation length (ref --max_length default 50).
                       # The online composition-budget check stops generation early when
                       # the privacy budget is exhausted.
  fail_mode: stop      # paper §2.1: "we halt the algorithm" on LD null token
  exclude_stopwords: false        # DPVOTE-04: the reference excludes stopwords ONLY in the
                                  # sparse variant (ensemble.py:82-88); the dense LD-Gumbel
                                  # path (ensemble.py:120-146) passes no exclude_ids. Keep
                                  # stopword exclusion for DPSparseVoteRAG, not here.
  exclude_question_words: false   # paper does NOT exclude question words
  stopwords_path: data/stopword_words.pt  # stopword token ids loaded from here
  random_seed: 42
  # C2: chat template for instruct models (auto) so each voter answers instead of
  # echoing the scaffold. No-op for base models (opt/pythia). Enables testing any LLM.
  use_chat_template: auto
  # C3 (opt-in, OFF by default): stop strings to truncate the answer, e.g. ["\nQuestion:"].
  stop_strings: null

delta_total: 1.0e-2    # The generator's own online (eps, delta) budget for ONE query, and
                       # INERT as this file stands: it is read only when
                       # `delta_token_from_workload` is false, and it is true above. Editing
                       # this number changes nothing about a run of this config; the runner
                       # derives the guard per cell as 2 * T * delta_token instead. It is
                       # kept, rather than deleted, as the value the pinned-delta path uses
                       # -- flip the flag and this is the guard.
                       # Deriving it makes the guard track what one query's releases actually
                       # spend instead of standing at a fixed number. Pinned at the axis
                       # delta it is vacuous -- at Q=100 a
                       # query spends a hundredth of it and nothing can ever trip it --
                       # while any value below delta_token refuses every release and leaves
                       # every answer empty for a reason no privacy parameter shows. What
                       # the workload is CHARGED is Q * T * delta_token = share * delta_axis,
                       # derived above and independent of this ceiling, so epsilon stays the
                       # binding constraint and the sweep moves in noise per vote.
k_retrieved: 50        # docs retrieved per query; must satisfy k_retrieved >= m*k (m=50,k=1)

metrics:
  # Full, consistent metric set across all methods. contains_accuracy is the
  # paper's "match accuracy" (prediction contains an answer). Only metrics
  # computable from predictions/references are listed.
  utility: [match_accuracy, contains_accuracy, rouge_l, f1_score, bert_score_f1, perplexity]
  privacy: []  # MIA is a separate run: python experiments/runner.py --mia-only

output_dir: results/dpvoterag/
max_queries: 40        # ~2x runtime (was 20; paper uses 100)
verbose: true
verbose_max_examples: 5

# The privacy unit is one corpus document, and the reported epsilon is a
# document-level guarantee. Splitting a document into c chunks and protecting a
# single chunk only reaches the document through group privacy, which costs
# (c*eps, c*exp((c-1)*eps)*delta): the delta grows exponentially in c, so at five
# chunks and eps=1 a delta of 1e-5 has already degraded past 1e-3 and the
# document-level statement is worth nothing.
#
# Set enabled: true only for a corpus whose documents are already short enough to
# be one privacy unit each, or for a run that deliberately accepts the
# degradation (metrics.workload_accounting.group_privacy gives the correction).
chunking:
  enabled: false
  chunk_size: 256   # words per chunk (used only when enabled: true)
  overlap: 32       # overlapping words between consecutive chunks (enabled: true only)
  # Cap on the words of a single indexed document. One document stays one entry and
  # one privacy unit; the cap only bounds how long a prompt built from it can get.
  # A corpus of whole documents has a long tail (MovieLens user profiles reach ~4800
  # words, about 7k tokens) and the voting methods feed m documents into one prompt,
  # which overruns a 2048-position model outright and strains larger ones.
  max_document_words: 400

# Points on the SHARED axis, crossed with the workload sizes below. The runner
# derives this method's own budget knob for each (target, Q) pair via
# metrics.workload_accounting.budget_for_target, so a target and the value that
# implements it cannot drift apart.
epsilon_targets: [1, 3, 5, 10, 50]

# Workload sizes the same run is priced for. Q is a property of the guarantee, not of
# the measurement: every cell answers the same questions, and Q only sets how much
# budget each one gets. A method that pays per query has to spend less on each as the
# stream grows; one whose guarantee already covers the stream does not move, and that
# contrast is what the sweep measures.
workload_queries: [1, 5, 25, 100]
