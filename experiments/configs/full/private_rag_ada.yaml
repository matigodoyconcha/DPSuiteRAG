method: private_rag

# === Private-RAG / MURAG-ADA (Wu et al., arXiv:2511.07637) ============
# Identical to private_rag.yaml EXCEPT the retrieval variant: MURAG-ADA releases a
# query-specific threshold via noisy prefix sums over score bins (Laplace noise),
# splitting the per-query budget eps_q = eps_thr + eps_RAG. Everything else (the
# per-document filter, the Alg.7 generator, the sweep) is the same — "only the
# retrieval differs". Headline guarantee: epsilon = M*eps_q, pure DP (delta = 0).

datasets:
  - name: natural_questions
    max_index_docs: 20000
    max_test_queries: 40
  - name: triviaqa
    max_index_docs: 20000
    max_test_queries: 40
  - name: chatdoctor
    max_index_docs: 20000
    max_test_queries: 40
  - name: searchqa
    max_index_docs: 20000
    max_test_queries: 40
  - name: medical_dirichlet_phi3
    max_index_docs: 20000
    max_test_queries: 40
  - name: movielens
    max_index_docs: 20000
    max_test_queries: 40

dataset:
  name: natural_questions

llm:
  name: huggingface
  model_name: facebook/opt-1.3b

llms:
  - model_name: facebook/opt-1.3b                  # 1.3B base (paper primary)
  - model_name: EleutherAI/pythia-1.4b             # 1.4B base (paper)
  - model_name: google/gemma-2-2b-it               # 2B instruct (gated)
  - model_name: Qwen/Qwen2.5-3B-Instruct           # 3B instruct
  - model_name: meta-llama/Llama-3.2-3B-Instruct   # 3B instruct (gated)
  - model_name: microsoft/Phi-3.5-mini-instruct    # 3.8B instruct
  - model_name: microsoft/Phi-4-mini-instruct      # 3.8B instruct

models:
  # Standardized retriever across all methods (arctic-embed-m-v1.5): one strong modern
  # embedder removes the retriever as a confound in the cross-method comparison
  # (fairness > per-paper faithfulness). Single-tower, cosine (vectors L2-normalised).
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5

private_rag:
  variant: murag_ada     # adaptive threshold via noisy prefix sums (the only change vs MURAG)
  M: 1                   # max retrievals per document (paper main results: M=1). Headline eps = M*eps_q.
  m: 50                  # voters in the Alg.7 subroutine
  k: 1                   # documents per voter (retrieved = m*k)
  epsilon_0: 2.0         # per-token budget (eps_Lap=eps_Expo=eps_0/2, c=floor(eps_RAG/eps_0)).
                         # Single-value fallback used only when top-level epsilon_0_values is absent (which takes precedence).
  vote_threshold: null   # SVT vote threshold theta (null => m/2 = 25, "half the m voters")
  t_max: 50
  # --- MURAG-ADA specific ---
  epsilon_thr: 1.0       # budget for the noisy-prefix-sum threshold release (paper default eps_thr=1.0);
                         # the generation step then uses eps_RAG = eps_q - eps_thr.
  # Score-bin grid for the prefix sums (traversed high -> low). The paper bins
  # DPR inner-product scores over the occupied band [70, 100] at width 0.2
  # (B=150); the faithful transposition to another retriever is to cover the
  # OCCUPIED score band at comparable relative granularity, not the theoretical
  # score range. On the arctic-embed cosine scale the observed corpus-score band
  # (measured on the chatdoctor scoring path: min~0.03, p1~0.20, p50~0.37,
  # p99~0.59, max~0.82) is covered by [0.15, 0.85]; docs scoring below score_min
  # are ignored by the prefix-sum walk (irrelevant at these scores). Per-bin
  # Laplace noise is on COUNTS (Lap(1/eps_thr)), independent of bin width; with
  # B~140 the accumulated prefix-sum noise std is ~sqrt(B)/eps_thr ~ 12 counts vs
  # the target k=50 -- the same regime the paper validated (threshold error <=
  # one bin at eps_thr >= 1.0, their Fig. 5). B = ceil((score_max-score_min)/bin_size).
  score_min: 0.15
  score_max: 0.85
  bin_size: 0.005        # B=140 bins over [0.15, 0.85], ~ the paper's B=150
  exclude_stopwords: false
  exclude_question_words: false
  stopwords_path: data/stopword_words.pt
  random_seed: 42
  use_chat_template: auto
  stop_strings: null

# eps_q must exceed eps_thr (eps_RAG = eps_q - eps_thr > 0) -- enforced by the
# retriever constructor. The runner additionally skips any (eps_q, eps_0) cell
# where eps_q < eps_thr + eps_0 (c = floor(eps_RAG/eps_0) = 0 -> empty output);
# see the epsilon_0_values comment below for which cells that drops.
# Derived by analysis/derive_epsilon_grids.py: the values whose epsilon_workload
# hits {1, 3, 10, 30, 100} on the SHARED axis at Q=100 queries, delta=1e-2.
# The sweep is the common target, not this method's own units, so a point here
# and a point of another method's grid are the same privacy level.
epsilon_q_values: [1.0, 3.0, 10.0, 30.0, 100.0]
# Paper Appendix E per-token grid. One result file per (eps_q, eps_0) cell; the paper
# reports the best-over-grid performance per eps_q point (selection at analysis time).
# Cells with eps_q < eps_thr + eps_0 are skipped per cell (e.g. eps_q=5 runs eps_0 in
# {0.5,1,2} fully since 5 >= 1+2; eps_q=2 runs eps_0 in {0.5,1} since 2 >= 1+1 and skips
# eps_0=2 since 2 < 1+2).
epsilon_0_values: [0.5, 1.0, 2.0]
k_retrieved: 50

metrics:
  utility: [match_accuracy, contains_accuracy, rouge_l, f1_score, bert_score_f1, perplexity]
  privacy: []  # MIA is a separate run: python experiments/runner.py --mia-only

output_dir: results/private_rag_ada/
max_queries: 40
verbose: true
verbose_max_examples: 3

# The privacy unit is one corpus document, and the reported epsilon is a
# document-level guarantee. Splitting a document into c chunks and protecting a
# single chunk only reaches the document through group privacy, which costs
# (c*eps, c*exp((c-1)*eps)*delta): the delta grows exponentially in c, so at five
# chunks and eps=1 a delta of 1e-5 has already degraded past 1e-3 and the
# document-level statement is worth nothing.
#
# Set enabled: true only for a corpus whose documents are already short enough to
# be one privacy unit each, or for a run that deliberately accepts the
# degradation (metrics.workload_accounting.group_privacy gives the correction).
chunking:
  enabled: false
  chunk_size: 256   # words per chunk (used only when enabled: true)
  overlap: 32       # overlapping words between consecutive chunks (enabled: true only)
  # Cap on the words of a single indexed document. One document stays one entry and
  # one privacy unit; the cap only bounds how long a prompt built from it can get.
  # A corpus of whole documents has a long tail (MovieLens user profiles reach ~4800
  # words, about 7k tokens) and the voting methods feed m documents into one prompt,
  # which overruns a 2048-position model outright and strains larger ones.
  max_document_words: 400
