method: dp_rag

# ---------------------------------------------------------------------------
# Datasets
# ---------------------------------------------------------------------------
# Paper-faithful note (arXiv:2412.19291v2, "Evaluation" section):
#   The DP-RAG paper evaluates on a SINGLE dataset: the synthetic medical
#   corpus published as huggingface.co/datasets/sarus-tech/medical_dirichlet_phi3.
#   In this benchmark that dataset is `medical_dirichlet_phi3` (exact match:
#   bench_datasets/medical_dirichlet_phi3.py loads the same HF id and uses
#   doctor_response as the document text). No other dataset is used by the paper.
#
# Corpus size (#documents) — the single most important value to get right:
#   The paper states verbatim: "With around 5000 documents and privacy
#   parameters set to epsilon ~ 5, and, delta = 1e-3, we got the result in
#   Fig. 6." So the faithful corpus size is ~5000 documents.
#   (The HF dataset's train split actually has 10,000 rows; the paper used
#   ~5000 of them, so 5000 is the paper-faithful corpus size, not 10000.)
#
# run_dp_rag.py iterates over the `datasets:` list (and falls back to the singular
# `dataset:` block when the list is absent). `max_index_docs` sizes the corpus and
# `max_test_queries` counts the questions; they are independent knobs. The paper uses
# a single dataset, so the list has one entry here.
datasets:
  - name: medical_dirichlet_phi3   # exact match to the paper's dataset
    split: train                   # dataset has only a train split
    max_index_docs: null              # index ALL docs (~10k; paper used ~5000)
    max_test_queries: 40           # ~2x runtime (was 20)
  # --- harmonized additions. CAVEAT: dp_rag's top-p exp-mech window
  # (min_score=-0.5 / max_score=0.8) is calibrated to arctic-embed on medical; it is NOT
  # recalibrated for these datasets, so retrieval may select too few/many docs (fidelity caveat). ---
  - name: chatdoctor
    split: train                   # chatdoctor has only a train split
    max_index_docs: 20000
    max_test_queries: 40
  - name: natural_questions        # split defaults to validation
    max_index_docs: 20000
    max_test_queries: 40
  - name: triviaqa
    max_index_docs: 20000
    max_test_queries: 40
  - name: searchqa
    max_index_docs: 20000
    max_test_queries: 40
  - name: movielens
    max_index_docs: 20000
    max_test_queries: 40

# Singular fallback block, used only when the `datasets:` list above is removed.
dataset:
  name: medical_dirichlet_phi3
  # No split here: the base block is merged into every entry of `datasets:`,
  # so a split written for one dataset would silently become every dataset's
  # evaluation split. Entries that need one declare it themselves.
  max_index_docs: null              # index ALL docs (~10k)
  max_test_queries: 60           # ~2x runtime (was 30)

llm:
  name: huggingface
  # Paper-faithful generation model. The official repo (sarus-tech/dp-rag)
  # DPRAGEngine defaults to microsoft/Phi-3.5-mini-instruct (dp_rag_engine.py),
  # and the medical_dirichlet_phi3 dataset itself was generated with Phi-3.
  # NOTE: this departs from the prior config (facebook/opt-1.3b). Phi-3.5-mini
  # is ~3.8B params and is heavier — accepted OOM risk per the faithfulness goal.
  model_name: microsoft/Phi-3.5-mini-instruct

# Sweep several generation LLMs the same way `datasets:` sweeps datasets.
# When an `llms:` list is present, each entry is merged over the singular `llm:`
# block above (which supplies defaults), and the run is repeated for every LLM.
# Results for each model land under <output_dir>/<dataset>/<model_label>/, where
# the label is the model_name with "/" replaced by "__". With a single LLM the
# path is unchanged (no per-model subdir). Remove the list to use just `llm:`.
llms:
  # Harmonized sweep: every method runs the SAME ≤4B LLMs.
  # 8B excluded (does not fit the 15.47 GiB GPU). Gated repos (gemma-2-2b-it,
  # Llama-3.2-3B-Instruct) self-skip with a [WARN] unless the user has HF access
  # + huggingface-cli login.
  - model_name: facebook/opt-1.3b                  # 1.3B base
  - model_name: Qwen/Qwen2.5-3B-Instruct           # 3B instruct
  - model_name: meta-llama/Llama-3.2-3B-Instruct   # 3B instruct (gated)
  - model_name: microsoft/Phi-3.5-mini-instruct    # 3.8B instruct (dp_rag paper/repo default)

models:
  # Standardized retriever across all methods (arctic-embed-m-v1.5): one strong modern
  # embedder removes the retriever as a confound in the cross-method comparison
  # (fairness > per-paper faithfulness). Single-tower, cosine (vectors L2-normalised).
  # For DP-RAG this shared choice also matches the reference (pup_vector_store.py uses
  # the same Snowflake arctic-embed with CLS pooling + L2-normalization), so unlike
  # methods whose papers used a different retriever, standardization costs DP-RAG no
  # paper-faithfulness here. (The repo's encode() applies no query prefix and pools the
  # CLS token; this benchmark's HFEmbedder may pool differently — a fidelity limitation.)
  # The top-p retriever's fixed window (min_score=-0.5 / max_score=0.8) was calibrated in
  # the paper for arctic-embed's cosine distribution, so it is correctly matched here.
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5

# ---------------------------------------------------------------------------
# Privacy budget
# ---------------------------------------------------------------------------
# Paper reports a single operating point for the medical evaluation, not a full
# sweep: epsilon ~ 5 total, delta = 1e-3 (Evaluation §). The official repo
# medical test (test_dp_rag.py) uses retrieval epsilon=0.5 and generation
# epsilon=5.0, giving a calibrated total epsilon ~ 5.3 at delta=1e-3.
# That point is what fixes the retrieval:generation proportion the shared axis scales
# (analysis.derive_epsilon_grids._dp_rag_retrieval_ratio); the sweep itself is the
# common epsilon_targets grid below, not a sweep around the paper's own epsilon.
# The proportion is constant per unit of per-token budget, but the split a reader
# interprets, eps_r / (eps_r + eps_g), is not: eps_g composes T copies of the
# per-token budget sublinearly, so retrieval's share rises toward the tight end of
# the axis. Each cell records the share it ran at in `epsilon_retrieval_share`.
delta: 1.0e-3   # paper value, and the per-query delta the mechanism is calibrated
                # against. It is not the axis delta: the workload figure the shared
                # axis reports is composed from it by metrics.workload_accounting.
k_retrieved: 5                           # used only when retriever_type=top_k; paper's medical eval uses top_p
# No cap on the released set. The reference repo truncates it to max_retrieve = 128
# (pup_vector_store.py), but a fixed-size release is a REPLACEMENT under add/remove of a
# corpus document once the selected set is that large -- the new document pushes another
# out, the two neighbours differ in two documents, and the generation sensitivity the
# method is accounted at doubles from C to 2C. The retriever returns the selected set.
# One answer length across every method that can express one, so a text metric
# measures the answer and not the budget it was allowed to fill. It also fixes how
# many exponential mechanisms this method's workload epsilon composes: one per
# generated token, against the 70 of the repo's own medical eval.
max_new_tokens: 30
# Forward the per-document prompts in sub-batches (dp_rag.generator.DOC_SUB_BATCH,
# the same 16 the vote generators use) instead of one document per model call. The
# top-p retriever below selects 43-129 documents per query, and at 30 tokens that is
# up to ~3,900 sequential forwards per query; grouped, it is ~270. The prompts grow in
# lockstep, so grouping them changes only the order the floating-point reductions run
# in — the mechanism, its seeds and its accounting are untouched.
# The rows are grouped shortest-first, because a forward pads every row to its longest:
# on ChatDoctor the selected documents run 114-883 tokens around a mean of ~320, so
# taking them in retrieval order pays for ~50% more tokens than the rows hold, against
# ~8% sorted. The logits are returned in document order regardless.
# Set false (or BENCHDP_DISABLE_DOC_BATCHING=1) to restore one forward per document.
use_batch_forward: true

# DP-ICL generation hyperparameters
#
# theta: weight of the public prior in the DP-ICL utility (called `omega` in the
#   official repo dp_model.py). Repo medical eval uses omega = 0.01.
#   U_ICL(r) = theta * ln(L_pub(r)) + sum(l_clipped_j(r))
#   - theta=0: the public prior has no influence; generation relies only on the private documents.
#   - theta=0.01 (paper/repo medical eval): the public prior weighs little; generation relies almost only on the private documents.
#   - large theta: pulls generation toward what the LLM would say with no private context.
#   Raising theta improves text fluency but reduces the influence of the private documents.
#
# temperature: sampling temperature T (same as the official sarus-tech/dp-rag repo, T=1.0).
#   The clipping bound C is NOT set by hand: it is derived as C = token_epsilon * T / 2
#   after calibrating token_epsilon. Substituting into the exponential mechanism
#   exp(token_epsilon * U / (2C)) cancels token_epsilon and leaves softmax(U / T),
#   exactly the official's do_sample=True with temperature T.
#   - T=1.0 (paper/repo default): reproduces the paper (arXiv:2412.19291v2).
#   - T<1: more deterministic sampling (sharpens the distribution); T>1: more random.
#
# alpha: parameter of the l_norm transform applied to the private logits (repo medical eval: alpha=1.0).
#   l_norm(r) = (exp(alpha * (ln L - ln max L)) - 1) / alpha
#   - alpha=1 (paper/repo default): l_norm(r) = L(r)/max L(r) - 1  (soft normalization).
#   - alpha close to 0: l_norm degenerates to log-prob differences (smoother, less emphasis on peaks).
#   - large alpha: strongly emphasizes the most probable token of each private document.
theta: 0.01       # repo `omega` in medical eval (test_dp_rag.py)
temperature: 0.3  # fairly deterministic (was paper default 1.0). NOTE: T is the only
                  # knob affecting the actual sampling distribution; lowering it sharpens
                  # generation and reduces the EMPIRICAL noise, while the reported
                  # (eps,delta) accounting is unchanged. Not 0 -> keeps some randomness.
alpha: 1.0        # repo `alpha` in medical eval (test_dp_rag.py)

# C2: route per-doc/public prompts through the chat template for instruct models
# (auto; no-op for base models). DP-ICL math is unchanged — only input encoding.
use_chat_template: auto
# C3 (opt-in, OFF by default): stop strings to truncate the final answer, e.g.
# ["\nQuestion:", "\nContext:"]. null disables it.
stop_strings: null

# Chunking configuration
#
# enabled: false (default, required for correct DP guarantees)
#   The DP exponential mechanism treats each indexed entry as one privacy unit (PU).
#   When a document is split into N chunks, a single individual contributes N entries
#   to the index, inflating the true sensitivity of the mechanism by up to N and
#   breaking the eps-DP proof.  Set enabled: false to use NoChunker, which keeps
#   one document = one PU.
#
#   This is also paper-faithful: the paper assumes each document relates to one
#   individual (one PU); the repo indexes whole doctor_response strings, no chunking.
#
#   Set enabled: true only when documents are already guaranteed to be short
#   (one doc <= one PU) or when the experiment intentionally accepts the
#   group-privacy degradation that chunking introduces.
chunking:
  enabled: false
  chunk_size: 256   # words per chunk (used only when enabled: true)
  overlap: 32       # overlapping words between consecutive chunks (enabled: true only)
  # Cap on the words of a single indexed document. One document stays one entry and
  # one privacy unit; the cap only bounds how long a prompt built from it can get.
  # A corpus of whole documents has a long tail (MovieLens user profiles reach ~4800
  # words, about 7k tokens) and the voting methods feed m documents into one prompt,
  # which overruns a 2048-position model outright and strains larger ones.
  max_document_words: 400

# Retriever type: "top_k" (default) or "top_p"
# Paper-faithful: the medical evaluation uses the top-p exponential mechanism
# (test_dp_rag.py sets top_p, not top_k).
retriever_type: top_p
# top_p specific parameters (only used when retriever_type: top_p)
# Paper/repo medical eval: top_p = 0.02 (share of total document weight selected).
# top_p_alpha (paper's alpha contrasting score differences in the top-p utility):
# repo default is 5.0 (PUPVectorStoreConfig). Note Fig. 5 in the paper illustrates
# the mechanism with p=0.3, alpha=1 for clarity, but the actual medical eval uses
# top_p=0.02; alpha=5.0 is the repo's configured value.
top_p: 0.02
top_p_alpha: 5.0
verbose: true
verbose_max_examples: 3
random_seed: 42

metrics:
  # Full, consistent metric set across all methods. Only metrics computable from
  # predictions/references are listed — the runners do not feed
  # contexts/queries/retrieval ids into the metric fn, so recall_at_k /
  # answer_faithfulness / answer_relevancy are omitted.
  utility: [match_accuracy, contains_accuracy, rouge_l, f1_score, bert_score_f1, perplexity]
  privacy: []  # MIA is a separate run: python experiments/runner.py --mia-only

output_dir: results/dp_rag/

# Points on the SHARED axis, crossed with the workload sizes below. The runner
# derives this method's own budget knob for each (target, Q) pair via
# metrics.workload_accounting.budget_for_target, so a target and the value that
# implements it cannot drift apart.
epsilon_targets: [1, 3, 5, 10, 50]

# Workload sizes the same run is priced for. Q is a property of the guarantee, not of
# the measurement: every cell answers the same questions, and Q only sets how much
# budget each one gets. A method that pays per query has to spend less on each as the
# stream grows; one whose guarantee already covers the stream does not move, and that
# contrast is what the sweep measures.
workload_queries: [1, 5, 25, 100]
