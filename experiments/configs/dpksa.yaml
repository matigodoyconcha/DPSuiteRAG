method: dpksa

# === Datasets (paper §6.1) ===========================================
# Tang et al. (arXiv:2602.14374) evaluate DP-KSA on TWO QA benchmarks:
# Natural Questions (NQ) and TriviaQA (TQA). Both retrieve from the FULL
# Wikipedia corpus (~21M passages, §6.1) and use a 100-question subset per
# dataset (questions with empty ground-truth references filtered out).
#
# The runner now iterates over this `datasets:` list and sets the per-dataset
# corpus size from `max_index_docs` (each entry may also set `max_test_queries`,
# else it falls back to the top-level `max_queries`).
# NOTE (corpus size): the paper retrieves from the FULL Wikipedia corpus
# (~21M passages, §6.1), which is infeasible to index locally. `max_index_docs`
# is therefore a tractable stand-in; raise it toward the paper corpus at the cost
# of indexing time/memory. `max_test_queries` = paper's 100-question subset.
datasets:
  - name: natural_questions   # NQ [Kwiatkowski et al. 2019]; paper corpus = ~21M Wikipedia passages
    max_index_docs: 200       # tractable stand-in (paper: full Wikipedia, §6.1)
    max_test_queries: 100     # 100-question subset, empty refs filtered (paper §6.1)
  - name: triviaqa            # TQA [Joshi et al. 2017]; paper corpus = ~21M Wikipedia passages
    max_index_docs: 200       # tractable stand-in (shared Wikipedia corpus)
    max_test_queries: 100

# Singular fallback block, used only when the `datasets:` list above is removed.
dataset:
  name: natural_questions

llm:
  name: huggingface
  # Faithful to paper §6.1 generators (user accepts OOM risk; departs from the
  # prior shared small-model choice, e.g. distilgpt2). Paper evaluates THREE
  # instruction-tuned generators; primary = Qwen2.5-3B-Instruct. Others:
  #   - meta-llama/Llama-3.2-3B-Instruct
  #   - meta-llama/Llama-3.1-8B-Instruct
  model_name: Qwen/Qwen2.5-3B-Instruct

models:
  # Paper §6.1 retriever is DPR (Dense Passage Retriever, BERT dual-encoder,
  # inner-product similarity). Closest HF equivalent for this benchmark's
  # SentenceTransformer-based embedder interface (no exact DPR drop-in here):
  embedder: sentence-transformers/facebook-dpr-question_encoder-single-nq-base

dpksa:
  n_docs: 80              # N = ensemble size / top-N retrieved (paper §6.1: 80, optimal per ablation §6.3.2)
  max_answer_tokens: 16   # per-document response length (paper T_max not given numerically; benchmark default)
  max_final_tokens: 32    # final keyword-conditioned answer (paper does not fix; benchmark default)
  k_min: 1                # FindBestK window (public utility knob, NOT privacy). Paper Alg. 3 ranges k=1..N-1
  k_max: null             # paper window k=1..N-1 with r(k); null => generator uses N-1 (= n_docs-1)
  ptr_delta_fraction: 0.5 # share of delta reserved for the PTR false-release (paper splits delta; fraction not given)
  ptr_noise_coupling: 1.0 # sigma = coupling * gumbel_scale (calibration knob)
  lowercase: true
  exclude_stopwords: false
  random_seed: 42

epsilon_values: [1, 2, 3, 5, 8]   # paper §5 Settings sweep
delta: 1.0e-4                      # paper §5 Settings: delta = 1e-4
k_retrieved: 80                   # = n_docs (N)

metrics:
  utility: [match_accuracy, f1_score, rouge_l]   # paper uses F1, ROUGE-1, ROUGE-L, normalized Levenshtein; F1 + ROUGE-L implemented here (ROUGE-1 / Levenshtein not in the registry)
  privacy: [mia_auc_bleu]

output_dir: results/dpksa/
max_queries: 100   # paper §6.1: 100-question subset per dataset
verbose: true
verbose_max_examples: 5
