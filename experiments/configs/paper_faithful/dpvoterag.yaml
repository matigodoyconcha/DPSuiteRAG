method: dpvoterag

# ===========================================================================
# PAPER-FAITHFUL config: ONLY the paper's datasets and LLM(s). The broad
# harmonized sweep (all ≤4B LLMs × the 6 shared datasets) lives in dpvoterag.yaml.
# ===========================================================================

# ----------------------------------------------------------------------------
# Paper-faithful configuration for DPVoteRAG.
# Source: Koga et al., "Privacy-Preserving Retrieval-Augmented Generation with
# Differential Privacy", arXiv:2412.04697v3; official repo tacchan7412/DPRAG.
# ----------------------------------------------------------------------------

# --- Datasets (paper §experiments) -------------------------------------------
# The paper evaluates DPVoteRAG on three datasets, each with a subset of
# 100 test questions (arXiv:2412.04697v3: "we use a subset of 100 questions").
#   - triviaqa / natural_questions: external corpus = Wikipedia (DPR passages).
#     Test questions are filtered to >=20 relevant docs, then split into 4 bins
#     (20-29, 30-39, 40-49, 50-59 relevant docs) sampling 25 questions per bin.
#     => the per-query retrieved corpus size ranges 20-59 docs (paper §exp).
#   - chatdoctor: external corpus = remaining ChatDoctor QA pairs (not Wikipedia);
#     "The external dataset consists of the remaining QA pairs from the original
#     ChatDoctor dataset, excluding the 100 patient questions used for testing."
#
# The runner now (a) iterates over this `datasets:` list, running every entry,
# and (b) sets the per-dataset corpus size from `max_index_docs`. Each entry may
# also set `max_test_queries` (falls back to the top-level `max_queries` below).
# NOTE: NQ/TriviaQA use the full Wikipedia DPR corpus in the paper; the values
# here are tractable stand-ins (per-query relevant docs span 20-59). Raise them
# to approach the paper corpus at the cost of indexing time/memory.
datasets:
  - name: triviaqa          # primary dataset (paper's main hyperparameter table)
    max_index_docs: 20000   # large but feasible corpus (full = null; paper ~21M Wikipedia)
    relevance_min: 20       # relevance-binning query filter (paper: keep 20 <= relevance < 60,
    relevance_max: 60       # split into 4 equal-width bins, sample 25 questions per bin).
    n_relevance_bins: 4     # Needs data/dpr/biencoder-trivia-dev.json
    per_bin: 25             # (scripts/download_dpr_relevance.py); skipped with a warning if absent.
  - name: natural_questions
    max_index_docs: 20000   # large but feasible corpus (full = null)
    relevance_min: 20       # relevance-binning query filter (paper: keep 20 <= relevance < 60,
    relevance_max: 60       # split into 4 equal-width bins, sample 25 questions per bin).
    n_relevance_bins: 4     # Needs data/dpr/biencoder-nq-dev.json
    per_bin: 25             # (scripts/download_dpr_relevance.py); skipped with a warning if absent.
  - name: chatdoctor
    max_index_docs: 20000   # large but feasible corpus (full = null)

# Singular fallback block, used only when the `datasets:` list above is removed.
dataset:
  name: triviaqa

# --- Models (paper-faithful; departs from prior shared small-model choice) ---
# The paper's primary generator is OPT (1.3B); it also reports Llama 3.1 (8B)
# and Pythia (1.4B). We pin OPT-1.3B as the faithful primary (user accepts OOM
# risk). NOTE: this replaces the previous small distilgpt2 used for portability.
llm:
  name: huggingface
  model_name: facebook/opt-1.3b   # paper primary generator (also: meta-llama/Llama-3.1-8B, EleutherAI/pythia-1.4b)

# Paper generators (Koga et al., §IV-A): OPT-1.3B (primary), Pythia-1.4B and
# Llama-3.1-8B. The 8B is re-enabled, but NOTE: DPVoteRAG forwards ALL m=50 voter
# prompts in ONE batch (generator.py:264-303), so an 8B (~16 GiB weights + KV for
# 50 contexts) may OOM on a single 24 GiB GPU depending on voter context length.
# The runner OOM-skips it cleanly; prefer a 48 GiB GPU or a 2-GPU shard for the
# 8B. Llama is gated (self-skips without HF access). One run per LLM.
llms:
  - model_name: facebook/opt-1.3b                  # 1.3B base (paper primary)
  - model_name: EleutherAI/pythia-1.4b             # 1.4B base (paper)
  - model_name: meta-llama/Llama-3.1-8B            # 8B base (paper; gated; batched 50 voters -> 24 GiB may OOM)

models:
  # Standardized retriever across all methods (arctic-embed-m-v1.5): one strong modern
  # embedder removes the retriever as a confound in the cross-method comparison
  # (fairness > per-paper faithfulness). Single-tower, cosine (vectors L2-normalised).
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5

dpvoterag:
  m: 50                # voters; paper OPT-1.3B main results use 50 (README: --n_split 50)
  k: 1                 # docs per voter; paper: "each voter receives 1 relevant document, i.e., k=1"
  epsilon_token: 2     # per-token budget; paper sweeps epsilon_token in {1,2,5}, 2 is the base
  delta_token: 1.0e-6  # DPVOTE-02: lowered from paper's 1e-5. With delta_total=1e-4 the
                       # delta budget (delta1 + T*delta_token) capped T<=9, making eps=20
                       # and eps=40 collapse to identical (degenerate) results. 1e-6 lifts
                       # the cap to ~99 so high-eps points differ.
  k_bar: 50            # paper: "set their parameter k_bar to be the number of voters" (= m)
  compose_method: simple  # DPVOTE-01: paper-faithful accounting = max(advanced, sequential)
                          # (footnote 4, Alg.2). 'rdp' is the reference RUNTIME default but
                          # drives Tmax->0 at low eps (empty answers); 'simple' matches the
                          # method written in the paper.
  tmax_absolute: null  # optional safety ceiling on top of max_length; null => none.
  max_length: 50       # DPVOTE-09: fixed generation length (ref --max_length default 50).
                       # The online composition-budget check stops generation early when
                       # the privacy budget is exhausted.
  fail_mode: stop      # paper §2.1: "we halt the algorithm" on LD null token
  exclude_stopwords: false        # DPVOTE-04: the reference excludes stopwords ONLY in the
                                  # sparse variant (ensemble.py:82-88); the dense LD-Gumbel
                                  # path (ensemble.py:120-146) passes no exclude_ids. Keep
                                  # stopword exclusion for DPSparseVoteRAG, not here.
  exclude_question_words: false   # paper does NOT exclude question words
  stopwords_path: data/stopword_words.pt  # stopword token ids loaded from here
  random_seed: 42
  # C2: chat template for instruct models (auto) so each voter answers instead of
  # echoing the scaffold. No-op for base models (opt/pythia). Enables testing any LLM.
  use_chat_template: auto
  # C3 (opt-in, OFF by default): stop strings to truncate the answer, e.g. ["\nQuestion:"].
  stop_strings: null

# Paper sweeps epsilon_total = 2 to 40 (x-axis of the privacy-utility figures);
# the larger 100/1000 points are kept for the benchmark's wider curve.
epsilon_values: [2, 4, 8, 10, 20, 40]
delta_total: 1.0e-4    # paper: delta_total = 1e-4
k_retrieved: 50        # docs retrieved per query; must satisfy k_retrieved >= m*k (m=50,k=1)

metrics:
  # Full, consistent metric set across all methods. contains_accuracy is the
  # paper's "match accuracy" (prediction contains an answer). Only metrics
  # computable from predictions/references are listed.
  utility: [match_accuracy, contains_accuracy, rouge_l, f1_score, bert_score_f1, perplexity]
  privacy: []  # MIA is a separate run: python experiments/runner.py --mia-only

output_dir: results/dpvoterag_paper_faithful/
max_queries: 40        # ~2x runtime (was 20; paper uses 100)
verbose: true
verbose_max_examples: 5

# Held at the benchmark's document-level privacy unit even here: the 200/20 word
# chunking the reference implementation uses would make the reported epsilon a
# per-chunk number while the paper states a per-document guarantee.
chunking:
  enabled: false
  chunk_size: 200
  overlap: 20
  # Cap on the words of a single indexed document. One document stays one entry and
  # one privacy unit; the cap only bounds how long a prompt built from it can get.
  # A corpus of whole documents has a long tail (MovieLens user profiles reach ~4800
  # words, about 7k tokens) and the voting methods feed m documents into one prompt,
  # which overruns a 2048-position model outright and strains larger ones.
  max_document_words: 400
