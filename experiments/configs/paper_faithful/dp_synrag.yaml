method: dp_synrag

# ===========================================================================
# PAPER-FAITHFUL config: ONLY the paper's datasets and LLM(s). The broad
# harmonized sweep (all ≤4B LLMs × the 6 shared datasets) lives in dp_synrag.yaml.
# ===========================================================================

# === Paper datasets (arXiv:2510.06719v2, Table 5) ===
# DP-SynRAG is evaluated on three datasets. run_dp_synrag.py iterates over the
# `datasets:` list (falling back to the singular `dataset:` block when absent),
# building a separate synthetic corpus per dataset.
# Each entry reads `name`/`split`/`max_samples` AND an optional `overrides:` block
# that deep-merges over the GLOBAL blocks below for that dataset only. The global
# blocks hold the Medical Synth (headline) values, which need no override.
#
# Generation hyperparameters (R, L, K, k, tau, sigma_h, sigma_mu, epsilon_theta_s)
# are Table 7 (Appendix C.3, arXiv:2510.06719v2), which reports the values "tuned
# using the validation queries" for the eps_total=10 operating point (Table 1).
# c (the L_inf clip) is NOT published there; it is derived below from the
# accountant so the reported epsilon matches Table 1's eps_total=10.
#
#   name                    paper dataset   #docs   #queries(val/test)  R     k    self_filter  infer.k
#   medical_dirichlet_phi3  Medical Synth   8000    1000 / 1000         500   80   yes          10
#   movielens               Movielens-1M    4083    500  / 500          500   100  yes          15
#   searchqa                SearchQA        7054    102  / 102          1000  100  no           10
# Sources: Table 5 (#docs, #queries), §6.1 (self_filter targeting, inference k),
# Table 7 (R, L, k, T, epsilon_theta_s, tau, sigma_h, sigma_mu).
datasets:
  - name: medical_dirichlet_phi3   # Medical Synth (Grislain 2025), 100 fictional diseases
    split: train                   # single train split; loader falls back to train
    max_samples: 8000              # full paper corpus (Table 5)
    max_test_queries: 200          # tighter CIs (paper test: 1000)
    # Table 7: R=500 L=5 k=80 T=70 K=10 tau=1.0 eps_theta_s=0.4, self_filter ON
    # => matches the global blocks below; no overrides needed.
  - name: movielens                # Movielens-1M (Harper & Konstan 2015), top-30 titles
    split: validation
    max_samples: 4083              # full paper corpus (Table 5)
    max_test_queries: 200          # tighter CIs (paper test: 500)
    top_movies: 30                 # paper: restrict to the 30 most frequently rated movies
    overrides:                     # Table 7: k=100; inference k=15 (§6.1); self_filter ON
      cluster_retrieval: {k: 100}
      inference: {k_retrieved: 15}
      metrics:                     # DPSYN-09: recommendation task -> Hit@k over the user's
                                   # top-k favorites (set-valued gold), NOT match_accuracy.
        utility: [hit_rate, perplexity]
      self_filter:                 # MUST override the prompt: the global self_filter asks
                                   # for a *diagnosis name* (Medical Synth), which a movie
                                   # document never contains. Prompt below is verbatim from
                                   # the paper's Appendix A.3 (Movielens).
        prompt_template: |
          Does the following document contain specific movie titles released in the 20th century? Answer only YES or NO.

          Document:
          {text}

          Answer:
  - name: searchqa                 # SearchQA (Dunn et al. 2017), Jeopardy! snippets
    # Original full-support source (kyunghyuncho/search_qa, ~60 snippets/question).
    # Same-split construction: the corpus is the union of the SAME `train`
    # questions' own snippets, so every gold answer is retrievable (~100%).
    split: train
    max_samples: 7054              # cap on pooled snippets (union of the sampled Qs)
    max_test_queries: 102          # paper test-set size (6 bins x 17 per bin)
    # Paper support-binning: keep questions with >=40 answer-bearing snippets,
    # stratify into 6 support bins (width 10) and sample 17 per bin => 102.
    min_answer_snippets: 40
    n_support_bins: 6
    per_bin: 17
    max_scan_questions: 30000      # bound the cost of scanning the split zip
    overrides:                     # Table 7: R=1000, k=100. T=70 and c=0.1057 follow the
                                   # global block (Table 7 lists T=70 for all three datasets).
      clustering: {R: 1000}
      cluster_retrieval: {k: 100}
      self_filter: {enabled: false}  # §6.1: SearchQA "lacks a fixed task" -> no self-filter

# Singular fallback block, used only when the `datasets:` list above is removed.
# Medical Synth is the paper's headline dataset (>60% accuracy, Table 3).
dataset:
  name: medical_dirichlet_phi3   # Medical Synth
  split: train
  max_samples: 8000              # paper corpus size, Table 5 (8,000 docs)
                                 # set to a small integer for quick dev runs

llm:
  name: huggingface
  # Paper generators (Models, Sec 6.1): Phi-4-mini-instruct (3.8B) primary,
  # plus Gemma-2-2B and Llama-3.1-8B (user accepts OOM risk for the larger ones):
  #   google/gemma-2-2b-it
  #   meta-llama/Llama-3.1-8B-Instruct
  model_name: microsoft/Phi-4-mini-instruct

# Paper generators (§6.1): Phi-4-mini-instruct (primary), Gemma-2-2B and
# Llama-3.1-8B. The 8B is re-enabled for a 24 GiB GPU: dp_synrag generates over a
# SINGLE context at a time (no batched ensemble), so the 8B (~16 GiB weights)
# fits with headroom. Gemma-2-2B and Llama are gated (self-skip without HF
# access). One run per LLM.
llms:
  - model_name: microsoft/Phi-4-mini-instruct      # 3.8B instruct (paper primary)
  # gemma-2-2b-it and Llama-3.1-8B-Instruct dropped for this run: Phi-4-mini only
  # (Llama-8B OOMs at fp16 on a 16 GiB GPU; re-add with 4-bit if a bigger GPU is used).

models:
  # Standardized retriever across all methods (arctic-embed-m-v1.5): one strong modern
  # embedder removes the retriever as a confound in the cross-method comparison
  # (fairness > per-paper faithfulness). Single-tower, cosine (vectors L2-normalised).
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5

# === Stage 1a: Keyword Extraction ===
keyword_extractor:
  K: 10                    # keywords per document (reconstructed)
  vocab_min_word_len: 1    # paper V is the full NLTK English words corpus (no length filter)
  exclude_stopwords: true  # paper builds vocab from the NLTK English corpus, minus stopwords
  max_new_tokens: 50

# === Stage 1a + 1b: noisy histogram + soft clustering ===
clustering:
  R: 500                   # Table 7: top-R keyword clusters, Medical/Movielens = 500.
                           # SearchQA overrides to 1000 (Table 7; dataset override below).
                           # R is eps-FREE (top-R of the noised histogram is post-processing).
  L: 5                     # Table 7: max clusters per document, all datasets.
  sigma_h: 7.071           # histogram noise. Derived from rho_hist=0.1 (reconstructed) and
                           # K=10 via Theorem 1: rho_hist = K/(2*sigma_h^2)
                           # => sigma_h = sqrt(10 / (2*0.1)) = 7.071.

# === Stage 1c: per-cluster mean embedding + DP threshold ===
cluster_retrieval:
  k: 80                    # Table 7: target docs per cluster for the exp-mech threshold
                           # (80 Medical Synth, 100 Movielens & SearchQA via dataset override).
                           # NOTE: distinct from inference.k_retrieved (paper k=10/15).
  sigma_mu: 7.454          # centroid noise. Derived from rho_retr=0.009 (reconstructed) via
                           # Theorem 1 Gaussian term: rho_mu = 1/(2*sigma_mu^2)
                           # => sigma_mu = sqrt(1/(2*0.009)) = 7.454.
  epsilon_theta_s: 0.4     # Table 7: exp-mech threshold budget, all datasets.
  # Range for the exp-mech threshold sampler. The paper fixes theta_s in [0, 1]
  # (arXiv:2510.06719v2, Stage 1c: "The similarity threshold theta_s in [0, 1] is
  # selected using the exponential mechanism ... as in Grislain 2025"). A wider
  # lower bound adds a flat max-utility plateau below the real cosine range that
  # pulls the sampled threshold to the floor, so S_r stops discriminating.
  min_sim: 0.0
  max_sim: 1.0

# === Stage 2d: Private Token Prediction ===
synthetic_generation:
  # This config targets the paper's eps_total=10 operating point (Table 1). T, L,
  # epsilon_theta_s, sigma_h, sigma_mu, tau are Table 7 (Appendix C.3); c (the
  # L_inf clip) is not published there, so it is DERIVED per-dataset with
  # metrics/privacy_accounting_zcdp.zcdp_dp_synrag by solving for the c that makes
  # the accountant's epsilon ~= 10 at the Table 7 values above (bisection on c,
  # since rho_token = (T/2)*(c/tau)^2 is monotone increasing in c).
  #
  # T (token length of the synthetic texts) is Table 7: 70 for all three datasets
  # ("K and T are kept constant across all experiments"). A short T truncates the
  # answer-bearing tail of the document (the "Diagnosis: <name>" line, the trailing
  # movie titles) BEFORE it is emitted, so the Stage-2e self-filter — which asks
  # whether a diagnosis/title is present — rejects almost everything and the corpus
  # collapses.
  T: 70
  # c derived at L=5, tau=1, sigma_h=7.071, sigma_mu=7.454, eps_theta_s=0.4, K=10,
  # delta=1e-3 (see above): T=70 -> c=0.1057, eps=9.997. rho_token scales with T,
  # not with R or k, so all three datasets share c=0.1057 at eps_total=10. Runner
  # writes <dataset>/<model>/c_<c>/run.json and re-derives eps per point.
  c_values: [0.1057]
  c: 0.1057                # cache/fallback default when c_values is absent
  tau: 1.0                 # Table 7: softmax temperature, all datasets. Must be > 1e-6;
                           # Theorem 1's T/2*(c/tau)^2 diverges at tau=0.
  batch_threshold: 0       # always take the sequential logits path (logits_to_keep=1).
                           # The batched path materializes (n_docs, seq_len, vocab) and
                           # needed 8.02 GiB on Movielens' long profiles -> CUDA OOM.
  # DPSYN-06: paper rephrase prompt (arXiv:2510.06719v2). "Write a new, similar
  # document" invited the model to invent (factual drift); the paper instead asks
  # to rephrase WITHOUT altering the important information.
  prompt_template: |
    Rephrase the following document without altering the important information contained within it.

    Document:
    {document}

    Rephrased document:
  task_prefix: ""

# === Stage 2e: Self-Filter ===
# Paper applies self-filter to Medical Synth (diagnosis name present?) and Movielens
# (20th-century movie title present?), but NOT to SearchQA (diverse open-domain
# questions, no fixed task). Enabled here for the primary dataset (Medical Synth).
# If the filter rejects EVERY synthetic document (expected at low c, where the
# generated text is too generic to name a diagnosis), Algorithm 1 simply discards
# them all: the corpus is empty, retrieval is disabled and the reader answers from
# parametric knowledge. That is a real point on the curve (DP-SynRAG -> no-RAG),
# reported as corpus_empty=true in last_stats rather than raised as an error.
self_filter:
  enabled: true            # Medical Synth: ON. (Movielens: ON; SearchQA: OFF.)
  prompt_template: |
    Does the following document contain any specific diagnosis names, even if they are fictional? Answer only YES or NO.

    Document:
    {text}

    Answer:
  max_new_tokens: 4

# === Privacy Budget (zCDP from paper) ===
delta: 1.0e-3              # Table 7 / Appendix C.3: delta = 1e-3 for all datasets.
# epsilon is the OUTPUT of the zCDP accountant given the noise/clipping params
# above; c (above) was solved so this output matches the paper's eps_total = 10
# (Table 1) at the Table 7 operating point, split per-step as rho_hist=0.1,
# rho_retr=0.009 (reconstructed); the runner prints the derived epsilon next to
# the metrics. (Note: this code's accountant uses the exp-mech term
# eps_theta_s^2/8, so the derived rho may differ slightly from the paper's
# printed rho_retr=0.009 — see README "Deliberate deviation".)

# === Inference (vanilla RAG over the synthetic corpus) ===
inference:
  k_retrieved: 10          # retrieved docs at inference (paper k=10 Medical Synth &
                           # SearchQA, k=15 Movielens; Implementation Details).
  max_new_tokens: 64       # the containment metric scores an answer that INCLUDES the
                           # gold span; 16 tokens cut off before the reader reached the
                           # entity (it paraphrased instead), so allow a longer answer.
  chunking:
    enabled: false         # synthetic documents are already 1 unit / entry

# === Bookkeeping ===
random_seed: 42
verbose: true
verbose_max_examples: 3

metrics:
  # Full, consistent metric set across all methods. perplexity is computed over
  # the synthetic corpus (texts=indexer.synthetic_texts in the runner).
  utility: [match_accuracy, contains_accuracy, rouge_l, f1_score, bert_score_f1, perplexity]
  privacy: []  # MIA is a separate run: python experiments/runner.py --mia-only

output_dir: results/dp_synrag_paper_faithful/
