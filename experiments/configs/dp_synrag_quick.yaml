method: dp_synrag

dataset:
  name: searchqa
  split: validation
  max_samples: 500       # corpus size: more source docs => more populated clusters
  max_test_queries: 50   # evaluation queries (decoupled from corpus)

# Sweep two generation LLMs that both fit on a 16 GB GPU (RTX 5080). DP-SynRAG uses
# the LLM for keyword extraction + synthetic generation; each entry is merged over the
# singular `llm:` block. The synthetic corpus is cached per model, so results land
# under <output_dir>/<dataset>/<model_label>/ with one cached corpus per LLM.
llm:
  name: huggingface
  model_name: Qwen/Qwen2.5-1.5B-Instruct
llms:
  - model_name: Qwen/Qwen2.5-1.5B-Instruct        # ~1.5B, ~3 GB bf16
  - model_name: microsoft/Phi-3.5-mini-instruct   # ~3.8B, ~8 GB bf16

models:
  embedder: sentence-transformers/multi-qa-mpnet-base-dot-v1   # match dp_synrag.yaml

# === Stage 1a: Keyword Extraction ===
keyword_extractor:
  K: 10
  vocab_min_word_len: 3
  exclude_stopwords: true
  max_new_tokens: 50

# === Stage 1a + 1b: noisy histogram + soft clustering ===
# Heavier + more realistic noise than the previous near-noiseless smoke. The full
# config derives sigma_h=7.071 from rho_hist=0.1 (Table 7); that much noise needs a
# corpus large enough that cluster counts exceed ~3*sigma_h. On this 500-doc smoke we
# use moderate noise so clusters still survive — raise max_samples / sigma_h toward
# the full values for a more paper-faithful (higher-noise, lower-epsilon) run.
clustering:
  R: 20
  L: 2
  sigma_h: 3.0   # realistic-but-runnable (full: 7.071); was 1.0 (near-noiseless)

# === Stage 1c: per-cluster mean embedding + DP threshold ===
cluster_retrieval:
  k: 40             # per-cluster doc target for the threshold EM
  sigma_mu: 2.0     # realistic-but-runnable centroid noise (full: 7.454); was 0.5
  epsilon_theta_s: 0.4   # exp-mech threshold budget (matches dp_synrag.yaml)

# === Stage 2d: Private Token Prediction ===
synthetic_generation:
  T: 40    # tokens per synthetic doc (full: 70); was 10
  c: 1.0
  tau: 1.0  # paper softmax temperature for private prediction (Table 7); was 0.1
  prompt_template: |
    Example document:
    {document}

    Write a new, similar document:
  task_prefix: ""

# === Stage 2e: Self-Filter ===
self_filter:
  enabled: false
  prompt_template: |
    Read the following document and answer the question with only YES or NO.

    Document:
    {text}

    Question: Does this document contain task-relevant information?
    Answer:
  max_new_tokens: 4

# === Privacy Budget (zCDP from paper) ===
delta: 1.0e-3

# === Inference (vanilla RAG over the synthetic corpus) ===
inference:
  k_retrieved: 10
  max_new_tokens: 24   # realistic answer length over the synthetic corpus (was 10)
  chunking:
    enabled: false

# === Bookkeeping ===
random_seed: 42
verbose: true
verbose_max_examples: 3

metrics:
  utility: [contains_accuracy, match_accuracy, rouge_l, f1_score, bert_score_f1]
  privacy: [mia_auc_bleu, private_entity_leakage]

output_dir: results/dp_synrag/
