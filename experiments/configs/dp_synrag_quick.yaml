method: dp_synrag

dataset:
  name: searchqa
  split: validation
  max_samples: 60  # smoke test: 60 fits the 15GB GPU with Phi-4-mini (100 OOMs)

llm:
  name: huggingface
  model_name: microsoft/Phi-4-mini-instruct   # match dp_synrag.yaml (paper primary generator)

models:
  embedder: sentence-transformers/multi-qa-mpnet-base-dot-v1   # match dp_synrag.yaml

# === Stage 1a: Keyword Extraction ===
keyword_extractor:
  K: 10
  vocab_min_word_len: 3
  exclude_stopwords: true
  max_new_tokens: 50

# === Stage 1a + 1b: noisy histogram + soft clustering ===
# Smoke-test sizing: with only ~60 docs, R must be well below the doc count so
# clusters are actually populated (the full config uses R=500 over thousands of docs).
clustering:
  R: 10
  L: 2
  sigma_h: 1.0

# === Stage 1c: per-cluster mean embedding + DP threshold ===
# k is the per-cluster doc target for the threshold EM; keep it small enough that
# the (few) docs per cluster can satisfy it, else every S_r comes back empty.
cluster_retrieval:
  k: 5
  sigma_mu: 0.5
  epsilon_theta_s: 1.0

# === Stage 2d: Private Token Prediction ===
synthetic_generation:
  T: 10   # short synthetic docs: fewer DP-sampled tokens = less accumulated noise
  c: 1.0
  tau: 0.1  # tau=0 raises ValueError (privacy proof requires tau>0); 0.1 = soft sampling
  prompt_template: |
    Example document:
    {document}

    Write a new, similar document:
  task_prefix: ""

# === Stage 2e: Self-Filter ===
self_filter:
  enabled: false
  prompt_template: |
    Read the following document and answer the question with only YES or NO.

    Document:
    {text}

    Question: Does this document contain task-relevant information?
    Answer:
  max_new_tokens: 4

# === Privacy Budget (zCDP from paper) ===
delta: 1.0e-3

# === Inference (vanilla RAG over the synthetic corpus) ===
inference:
  k_retrieved: 5
  max_new_tokens: 10   # short answers over the synthetic corpus (inference is post-processing, no DP cost)
  chunking:
    enabled: false

# === Bookkeeping ===
random_seed: 42
verbose: true
verbose_max_examples: 3

metrics:
  utility: [contains_accuracy, match_accuracy, rouge_l, f1_score, bert_score_f1]
  privacy: [mia_auc_bleu, private_entity_leakage]

output_dir: results/dp_synrag/
