method: dpsparsevoterag

dataset:
  name: squad   # answer-bearing contexts (loader seeds index with each query's gold context)

llm:
  name: huggingface
  model_name: facebook/opt-1.3b   # match dpsparsevoterag.yaml (paper primary generator)

models:
  embedder: sentence-transformers/facebook-dpr-question_encoder-multiset-base   # match dpsparsevoterag.yaml (DPR)

dpsparsevoterag:
  m: 10
  k: 1
  epsilon_token: 1000   # NO-NOISE sanity check: split into SVT/LD shares, both ~noiseless
  delta_token: 1.0e-5
  k_bar: 10
  tau: null
  tmax_absolute: 24   # no-noise run: long enough to contain the answer span (was 10)
  random_seed: 42

# per-token noise is set by epsilon_token above; epsilon_total only bounds token count.
epsilon_values: [10000]
delta_total: 1.0e-4
k_retrieved: 10

metrics:
  utility: [match_accuracy, contains_accuracy, rouge_l, f1_score, bert_score_f1]
  privacy: [mia_auc_bleu, private_entity_leakage]

output_dir: results/dpsparsevoterag_quick/
max_queries: 20
verbose: true
verbose_max_examples: 3
