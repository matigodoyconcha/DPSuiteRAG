method: dpsparsevoterag

dataset:
  name: natural_questions

llm:
  name: huggingface
  model_name: facebook/opt-350m

models:
  embedder: sentence-transformers/all-MiniLM-L6-v2

dpsparsevoterag:
  m: 10
  k: 1
  epsilon_token: 2
  delta_token: 1.0e-5
  k_bar: 10
  tau: null
  tmax_absolute: 120
  random_seed: 42

epsilon_values: [10]
delta_total: 1.0e-4
k_retrieved: 10

metrics:
  utility: [match_accuracy]
  privacy: [mia_auc_bleu]

output_dir: results/dpsparsevoterag_quick/
max_queries: 5
verbose: true
verbose_max_examples: 2
