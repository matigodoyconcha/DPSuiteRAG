# Derived from full/ by hand -- keep the two in step when full/ changes.
#
# The common protocol (experiments/configs/full/dpvoterag.yaml) shrunk to a few minutes:
# chatdoctor, distilgpt2, 4 questions, two points per budget knob. Verifies that
# the method runs end to end and honours the seeds; it is too small to time the real
# grid or to calibrate a retrieval threshold. Edit the full config and regenerate.
method: dpvoterag
datasets:
- name: chatdoctor
  max_index_docs: 500
  max_test_queries: 4
dataset:
  name: chatdoctor
  max_index_docs: 500
  max_test_queries: 4
llm:
  name: huggingface
  model_name: distilgpt2
llms:
- model_name: distilgpt2
models:
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5
dpvoterag:
  truncate_at_double_slash: false
  m: 50
  k: 1
  epsilon_token_from_budget: true
  epsilon_token: 2
  delta_token_from_workload: true
  delta_token: 1.0e-06
  k_bar: 50
  compose_method: simple
  tmax_absolute: null
  max_length: 30
  fail_mode: stop
  exclude_stopwords: false
  exclude_question_words: false
  stopwords_path: data/stopword_words.pt
  random_seed: 42
  use_chat_template: auto
  stop_strings: null
delta_total: 0.01
k_retrieved: 50
metrics:
  utility:
  - match_accuracy
  - contains_accuracy
  - rouge_l
  - f1_score
  - bert_score_f1
  - perplexity
  privacy: []
output_dir: results/smoke/dpvoterag/
max_queries: 4
verbose: true
verbose_max_examples: 5
chunking:
  enabled: false
  chunk_size: 256
  overlap: 32
  max_document_words: 400
epsilon_targets:
- 10
- 50
workload_queries:
- 1
- 5
