method: dpksa

dataset:
  name: squad          # answer-bearing contexts (loader seeds index with each query's gold context)
  max_index_docs: 200  # heavier smoke corpus

# Sweep two generation LLMs that both fit on a 16 GB GPU (RTX 5080). Each entry is
# merged over the singular `llm:` block; results land under
# <output_dir>/<dataset>/<model_label>/ (one subdir per model). DP-KSA runs N
# generations per query but frees GPU memory each query, so both models fit.
llm:
  name: huggingface
  model_name: Qwen/Qwen2.5-1.5B-Instruct
llms:
  - model_name: Qwen/Qwen2.5-1.5B-Instruct        # ~1.5B, ~3 GB bf16
  - model_name: microsoft/Phi-3.5-mini-instruct   # ~3.8B, ~8 GB bf16

models:
  embedder: sentence-transformers/facebook-dpr-question_encoder-single-nq-base   # match dpksa.yaml (DPR)

dpksa:
  n_docs: 32              # ensemble size / top-N retrieved (full: 80); larger N => bigger
                          # keyword histogram gaps => more queries pass PTR at realistic eps
  max_answer_tokens: 16   # per-document response length (matches dpksa.yaml)
  max_final_tokens: 32    # final keyword-conditioned answer (matches dpksa.yaml)
  k_min: 1
  k_max: 4
  ptr_delta_fraction: 0.5
  ptr_noise_coupling: 0.25  # DPKSA-05: smaller sigma so the PTR test is not effectively always-fail
  lowercase: true
  exclude_stopwords: false
  random_seed: 42

# Realistic epsilon sweep (subset of paper §5 sweep [1,2,3,5,8]). At these budgets PTR
# genuinely fails on some queries (no keywords released) — that is the realistic regime.
epsilon_values: [3, 8]
delta: 1.0e-4
k_retrieved: 32           # = n_docs

metrics:
  utility: [match_accuracy, contains_accuracy, rouge_l, f1_score, bert_score_f1]
  privacy: [mia_auc_bleu]

output_dir: results/dpksa/
max_queries: 50
verbose: true
verbose_max_examples: 3
