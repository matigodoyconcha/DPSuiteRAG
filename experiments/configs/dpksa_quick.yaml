method: dpksa

dataset:
  name: squad   # answer-bearing contexts (loader seeds index with each query's gold context)

llm:
  name: huggingface
  model_name: Qwen/Qwen2.5-3B-Instruct   # match dpksa.yaml (paper primary generator)

models:
  embedder: sentence-transformers/facebook-dpr-question_encoder-single-nq-base   # match dpksa.yaml (DPR)

dpksa:
  n_docs: 8               # reduced from 80: keeps the smoke run cheap
  max_answer_tokens: 10   # short per-doc responses (feed the keyword histogram)
  max_final_tokens: 24    # no-noise run: long enough to contain the answer span (was 10)
  k_min: 1
  k_max: 4
  ptr_delta_fraction: 0.5
  ptr_noise_coupling: 1.0
  lowercase: true
  exclude_stopwords: false
  random_seed: 42

# No-noise sanity check: huge epsilon => tiny FindBestK Gumbel + tiny PTR sigma,
# so the PTR test passes and the exact top-k keywords are released (vs always-empty
# keywords at small epsilon).
epsilon_values: [1000, 10000]
delta: 1.0e-4
k_retrieved: 8            # = n_docs

metrics:
  utility: [match_accuracy, rouge_l]
  privacy: [mia_auc_bleu]

output_dir: results/dpksa/
max_queries: 20
verbose: true
verbose_max_examples: 3
