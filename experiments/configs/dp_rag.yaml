method: dp_rag

dataset:
  name: natural_questions
  split: validation
  max_samples: 100

llm:
  name: huggingface
  model_name: facebook/opt-1.3b

models:
  # Benchmark design decision: a single "traditional", shared embedder
  # (all-MiniLM-L6-v2, mean-pooling, 384-d) is used across ALL compared methods
  # instead of the Snowflake arctic-embed (CLS pooling + query prefix) from the
  # official paper (sarus-tech/dp-rag). The goal is comparability: isolate the
  # effect of the DP mechanism, not of the encoder. This intentionally departs
  # from the paper.
  #
  # Implication: the fixed window min_score=-0.5 / max_score=0.8 used by the
  # top-p retriever (DPTopPRetriever) was calibrated in the paper for the cosine
  # score distribution of arctic-embed. With MiniLM the cosine range differs, so
  # that window is a shared standard convention across methods, not a per-embedder
  # calibration. Accepted deliberately.
  embedder: sentence-transformers/all-MiniLM-L6-v2

epsilon_retrieval_values: [0.5, 1.0, 2.0, 5.0, 10.0]
epsilon_generation_values: [0.1, 0.5, 1.0, 2.0, 5.0]
delta: 1.0e-3
k_retrieved: 5
max_docs: 20
max_new_tokens: 64
use_batch_forward: true

# DP-ICL generation hyperparameters
#
# theta: peso del prior público en la utilidad DP-ICL.
#   U_ICL(r) = theta * ln(L_pub(r)) + sum(l_clipped_j(r))
#   - theta=0: el prior público no influye; la generación se basa solo en los documentos privados.
#   - theta=1 (default): balance equilibrado.
#   - theta grande: acerca la generación a lo que el LLM diría sin ningún contexto privado.
#   Subir theta mejora la fluidez del texto pero reduce la influencia de los documentos privados.
#
# temperature: temperatura de muestreo T (igual que el repo oficial sarus-tech/dp-rag).
#   El bound de clipping C NO se fija a mano: se deriva como C = token_epsilon * T / 2
#   tras calibrar token_epsilon. Al sustituir en el exponential mechanism
#   exp(token_epsilon * U / (2C)) se cancela token_epsilon y queda softmax(U / T),
#   exactamente el do_sample=True con temperatura T del oficial.
#   - T=1.0 (default): reproduce el paper (arXiv:2412.19291v2).
#   - T<1: muestreo más determinista (afila la distribución); T>1: más aleatorio.
#
# alpha: parámetro de la transformación l_norm aplicada a los logits privados.
#   l_norm(r) = (exp(alpha * (ln L - ln max L)) - 1) / alpha
#   - alpha=1 (default): l_norm(r) = L(r)/max L(r) - 1  (normalización suave).
#   - alpha cercano a 0: l_norm degenerada a diferencias de log-prob (más suave, menos énfasis en picos).
#   - alpha grande: enfatiza fuertemente el token más probable de cada documento privado.
theta: 0.01
temperature: 1.0
alpha: 1.0

# Chunking configuration
#
# enabled: false (default, required for correct DP guarantees)
#   The DP exponential mechanism treats each indexed entry as one privacy unit (PU).
#   When a document is split into N chunks, a single individual contributes N entries
#   to the index, inflating the true sensitivity of the mechanism by up to N and
#   breaking the ε-DP proof.  Set enabled: false to use NoChunker, which keeps
#   one document = one PU.
#
#   Set enabled: true only when documents are already guaranteed to be short
#   (one doc ≤ one PU) or when the experiment intentionally accepts the
#   group-privacy degradation that chunking introduces.
chunking:
  enabled: false
  chunk_size: 256   # words per chunk (used only when enabled: true)
  overlap: 32       # overlapping words between consecutive chunks (enabled: true only)

# Retriever type: "top_k" (default) or "top_p"
retriever_type: top_k
# top_p specific parameters (only used when retriever_type: top_p)
top_p: 0.3
top_p_alpha: 1.0
verbose: false
verbose_max_examples: 3
random_seed: 42

metrics:
  utility: [match_accuracy, rouge_l]
  privacy: [mia_auc_bleu, private_entity_leakage]

output_dir: results/dp_rag/
