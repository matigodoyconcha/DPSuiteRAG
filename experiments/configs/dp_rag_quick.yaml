method: dp_rag

dataset:
  name: squad   # answer-bearing contexts; loader seeds the index with each query's gold context
  split: validation
  max_samples: 20  # smoke test: 20 docs (corpus) + 20 queries

llm:
  name: huggingface
  model_name: microsoft/Phi-3.5-mini-instruct   # match dp_rag.yaml (paper-faithful)

models:
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5   # match dp_rag.yaml

# No-noise sanity check: huge epsilon => token_epsilon huge => exp-mechanism is
# essentially argmax, so output should look like ordinary (non-DP) RAG.
epsilon_retrieval_values: [1000.0]          # near-exact retrieval
epsilon_generation_values: [1000.0, 10000.0]  # near-noiseless generation
delta: 1.0e-3
k_retrieved: 5
max_docs: 20
max_new_tokens: 10   # short answers: fewer tokens = less accumulated DP noise
use_batch_forward: true

theta: 0.01
temperature: 1.0
alpha: 1.0

chunking:
  enabled: false
  chunk_size: 256
  overlap: 32

retriever_type: top_k
top_p: 0.3
top_p_alpha: 1.0
verbose: true
verbose_max_examples: 3
random_seed: 42

metrics:
  utility: [match_accuracy, rouge_l]
  privacy: [mia_auc_bleu]

output_dir: results/dp_rag/
