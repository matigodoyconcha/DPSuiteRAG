method: dp_rag

dataset:
  name: natural_questions
  split: validation
  max_samples: 5  # smoke test: verify pipeline end-to-end

llm:
  name: huggingface
  model_name: microsoft/Phi-3.5-mini-instruct   # match dp_rag.yaml (paper-faithful)

models:
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5   # match dp_rag.yaml

# 2x2 grid = 4 combos, enough to verify sweep logic
epsilon_retrieval_values: [1.0, 5.0]
epsilon_generation_values: [0.5, 2.0]
delta: 1.0e-3
k_retrieved: 5
max_docs: 20
max_new_tokens: 64
use_batch_forward: true

theta: 0.01
temperature: 1.0
alpha: 1.0

chunking:
  enabled: false
  chunk_size: 256
  overlap: 32

retriever_type: top_k
top_p: 0.3
top_p_alpha: 1.0
verbose: true
verbose_max_examples: 3
random_seed: 42

metrics:
  utility: [match_accuracy, rouge_l]
  privacy: [mia_auc_bleu]

output_dir: results/dp_rag/
