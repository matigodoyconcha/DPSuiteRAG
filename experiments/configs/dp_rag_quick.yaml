method: dp_rag

dataset:
  name: triviaqa
  max_samples: 5

llm:
  name: huggingface
  model_name: "facebook/opt-350m"
models:
  embedder: sentence-transformers/all-MiniLM-L6-v2

epsilon_retrieval_values: [100.0]
epsilon_generation_values: [500.0]
delta: 1.0e-3
k_retrieved: 5
max_docs: 500
max_new_tokens: 32
use_batch_forward: true

# Retriever type: "top_k" (default) or "top_p"
retriever_type: top_k
# top_p specific parameters (only used when retriever_type: top_p)
top_p: 0.3
top_p_alpha: 1.0
verbose: True
verbose_max_examples: 4
random_seed: 42

metrics:
  utility: [match_accuracy, rouge_l]
  privacy: [mia_auc_bleu, private_entity_leakage]

output_dir: results/dp_rag_quick/
