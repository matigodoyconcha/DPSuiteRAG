method: dpvoterag

dataset:
  name: squad   # answer-bearing contexts (loader seeds index with each query's gold context)

llm:
  name: huggingface
  model_name: facebook/opt-1.3b   # match dpvoterag.yaml (paper primary generator)

models:
  embedder: sentence-transformers/facebook-dpr-question_encoder-single-nq-base   # match dpvoterag.yaml (DPR, ST-namespaced)

dpvoterag:
  m: 10           # reduced from 30: allows 7B model, still representative
  k: 1
  epsilon_token: 1000   # NO-NOISE sanity check: gumbel scale = 1/eps_token ~ 0 => LD-Gumbel ~ argmax of votes
  delta_token: 1.0e-5
  k_bar: 10       # must be <= m
  tmax_absolute: 10   # short answers: fewer tokens = less accumulated LD-Gumbel noise
  random_seed: 42

# epsilon_total only bounds how many tokens may be emitted; per-token noise is set
# by epsilon_token above. One large value suffices for the no-noise check.
epsilon_values: [10000]
delta_total: 1.0e-4
k_retrieved: 10   # m * k = 10

metrics:
  utility: [contains_accuracy]
  privacy: [mia_auc_bleu]

output_dir: results/dpvoterag/
max_queries: 5
verbose: true
verbose_max_examples: 3
