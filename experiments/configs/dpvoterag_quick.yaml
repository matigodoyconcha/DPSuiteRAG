method: dpvoterag

dataset:
  name: squad   # answer-bearing contexts (loader seeds index with each query's gold context)

llm:
  name: huggingface
  model_name: facebook/opt-1.3b   # match dpvoterag.yaml (paper primary generator)

models:
  embedder: sentence-transformers/facebook-dpr-question_encoder-single-nq-base   # match dpvoterag.yaml (DPR, ST-namespaced)

dpvoterag:
  m: 10           # reduced from 30: allows 7B model, still representative
  k: 1
  epsilon_token: 1000   # NO-NOISE sanity check: gumbel scale = 1/eps_token ~ 0 => LD-Gumbel ~ argmax of votes
  delta_token: 1.0e-5
  k_bar: 10       # must be <= m
  tmax_absolute: 24   # no-noise run: long enough to contain the answer span (was 10)
  random_seed: 42

# epsilon_total only bounds how many tokens may be emitted; per-token noise is set
# by epsilon_token above. The per-token LD-Gumbel RDP cost grows ~epsilon_token^2,
# so at epsilon_token=1000 ONE token costs ~1e6; to emit tmax_absolute=24 tokens the
# total budget must be ~epsilon_token^2 * tmax (and delta_total must be loose enough,
# else the delta cap stops generation at ~10 tokens). 3e7 + 1e-3 yields t_max~29.
epsilon_values: [30000000.0]
delta_total: 1.0e-3
k_retrieved: 10   # m * k = 10

metrics:
  utility: [match_accuracy, contains_accuracy, rouge_l, f1_score, bert_score_f1]
  privacy: [mia_auc_bleu, private_entity_leakage]

output_dir: results/dpvoterag/
max_queries: 20
verbose: true
verbose_max_examples: 3
