method: dpsparsevoterag

# --- Datasets (Koga et al., arXiv:2412.04697v3, §IV-A) ---
# The paper evaluates DPSparseVoteRAG on TriviaQA, Natural Questions and
# ChatDoctor, with 100 test questions per dataset. For NQ/TriviaQA the corpus is
# the Wikipedia passage collection (DPR-style); the paper does NOT fix a small
# global #docs — it filters to questions with 20-59 ground-truth relevant docs
# and retrieves the m*k most relevant per query. For ChatDoctor the corpus is
# "the remaining QA pairs" (all minus the 100 test questions). The per-dataset
# #docs below records this faithful corpus intent.
#
# The runner now iterates over this `datasets:` list and sets the per-dataset
# corpus size from `max_index_docs` (each entry may also set `max_test_queries`,
# else it falls back to the top-level `max_queries`). NOTE: NQ/TriviaQA use the
# full Wikipedia DPR corpus in the paper (20-59 relevant docs/query); the values
# here are tractable stand-ins — raise them to approach the paper corpus at the
# cost of indexing time/memory.
datasets:
  - name: triviaqa            # 100 test queries; Wikipedia passages, 20-59 relevant docs/query
    max_index_docs: 20000     # large but feasible corpus (full = null)
  - name: natural_questions   # 100 test queries; Wikipedia passages, 20-59 relevant docs/query
    max_index_docs: 20000     # large but feasible corpus (full = null)
  - name: chatdoctor          # 100 patient questions; corpus = remaining QA pairs
    max_index_docs: 20000     # large but feasible corpus (full = null)
  # --- harmonized additions (same 6 datasets across all methods) ---
  - name: searchqa
    max_index_docs: 20000
    max_test_queries: 40
  - name: medical_dirichlet_phi3
    max_index_docs: 20000
    max_test_queries: 40
  - name: movielens             # recommendation task; scored by match here (no hit_rate in this runner)
    max_index_docs: 20000
    max_test_queries: 40

# Singular fallback block, used only when the `datasets:` list above is removed.
dataset:
  name: natural_questions

llm:
  name: huggingface
  # Paper primary generator (§IV-A, OPT 1.3B = "left column" main results).
  # NOTE: departs from the prior shared small-model choice (dpvoterag.yaml uses
  # distilgpt2, the _quick variant opt-350m); OOM risk accepted by the user.
  model_name: facebook/opt-1.3b

# All paper generators (swept like datasets; one run per LLM).
llms:
  # Harmonized sweep: every method runs the SAME ≤4B LLMs.
  # 8B excluded (does not fit the 15.47 GiB GPU). Gated repos (gemma-2-2b-it,
  # Llama-3.2-3B-Instruct) self-skip with a [WARN] unless the user has HF access
  # + huggingface-cli login.
  - model_name: facebook/opt-1.3b                  # 1.3B base (dpsparsevoterag paper primary)
  - model_name: EleutherAI/pythia-1.4b             # 1.4B base
  - model_name: google/gemma-2-2b-it               # 2B instruct (gated)
  - model_name: Qwen/Qwen2.5-3B-Instruct           # 3B instruct
  - model_name: meta-llama/Llama-3.2-3B-Instruct   # 3B instruct (gated)
  - model_name: microsoft/Phi-3.5-mini-instruct    # 3.8B instruct
  - model_name: microsoft/Phi-4-mini-instruct      # 3.8B instruct

models:
  # Standardized retriever across all methods (arctic-embed-m-v1.5): one strong modern
  # embedder removes the retriever as a confound in the cross-method comparison
  # (fairness > per-paper faithfulness). Single-tower, cosine (vectors L2-normalised).
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5

dpsparsevoterag:
  m: 50                  # voters; paper DPSparseVoteRAG OPT-1.3B main results use 50 (README: --n_split 50)
  k: 1                   # one relevant document per voter (paper k=1)
  epsilon_token: 2       # Single-value fallback, used only when epsilon_token_values (below) is absent.
                         # Per-token budget (LD + SVT), split by sparse_fraction below.
                         # =2 -> LD 1.0 + SVT 1.0 per release == paper README (--dp_eps 1 --sparse_eps 1).
                         # epsilon_total (sweep below) stays the ONLINE CAP / max epsilon you set.
  sparse_fraction: 0.5   # fraction of the per-token budget (= of epsilon_total) reserved for the SVT
                         # threshold/Laplace; LD-Gumbel gets the rest (paper §3.3: eps_token/2 each)
  delta_token: 1.0e-6    # DPSPARSE-03: lowered from paper's 1e-5. With delta_total=1e-4 the
                         # delta budget capped T<=9, making eps=20 and eps=40 collapse to
                         # identical results; 1e-6 lifts the cap so high-eps points differ.
  k_bar: 50              # reduced LD domain = number of voters m (paper: "k_bar = number of voters")
  threshold: 25          # SVT agreement threshold tau = m/2 = 25 (paper README: --threshold 25 with m=50)
  tmax_absolute: 50      # DPSPARSE-04: generation-length ceiling (ref --max_length 50). The
                         # private-release counter c (paper Alg.3 line 25) and the online
                         # budget check stop generation earlier; this caps all-public rambling
                         # (was 200, which let answers run public to 200 tokens).
  max_private_tokens: 32  # private-release ceiling `c` (paper Alg.3 line 25): cap on the number of
                          # private (LD) token releases per answer. NOT a budget divisor —
                          # the per-token budget is the epsilon_token value for the current curve
                          # (fixed within a curve; see epsilon_token_values below for the sweep).
                          # epsilon_total is the real stopping cap; this just bounds how many
                          # private releases can happen.
  exclude_stopwords: true         # exclude stopwords (privacy-neutral; the excluded set is
                                  # public/data-independent). Stops the public token from
                                  # emitting stopword boilerplate for free, improving utility.
  exclude_question_words: false   # paper does NOT exclude question words from the mechanism
  stopwords_path: data/stopword_words.pt  # stopword token ids loaded from here
  random_seed: 42
  # C2: chat template for instruct models (auto) so each voter / public token answers
  # instead of echoing the scaffold. No-op for base models. Enables testing any LLM.
  use_chat_template: auto
  # C3 (opt-in, OFF by default): stop strings to truncate the answer, e.g. ["\nQuestion:"].
  stop_strings: null

epsilon_values: [2, 5, 10, 20, 40]  # paper sweeps epsilon_total = 2 to 40
epsilon_token_values: [1, 2, 5]      # paper §IV-A per-token budgets epsilon_token in {1, 2, 5} (each split
                                     # epsilon_token/2 for LD-Gumbel + epsilon_token/2 for SVT per §3.3; the
                                     # reference README's --dp_eps 1 --sparse_eps 1 is the epsilon_token=2
                                     # configuration). One curve per value: at epsilon_token in {1, 2} the
                                     # delta_token cap (see delta_token above) makes epsilon_total >= ~10
                                     # points coincide; the epsilon_token=5 curve differentiates them at
                                     # high epsilon_total. Takes precedence over the single epsilon_token
                                     # value in the dpsparsevoterag block above.
delta_total: 1.0e-4                 # paper delta_total = 1e-4
k_retrieved: 50                     # m*k retrieved docs/query (paper retrieves m*k most relevant); m=50,k=1

metrics:
  # Full, consistent metric set across all methods. contains_accuracy is the
  # paper's "match accuracy". Only metrics computable from predictions/
  # references are listed.
  utility: [match_accuracy, contains_accuracy, rouge_l, f1_score, bert_score_f1, perplexity]
  privacy: [mia_auc_bleu]

output_dir: results/dpsparsevoterag/
max_queries: 40         # ~2x runtime (was 20; paper uses 100)
verbose: true
verbose_max_examples: 3
