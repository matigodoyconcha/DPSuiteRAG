# Mirrors full/ -- edit full/ and carry the change here.
method: dpvoterag
datasets:
- name: triviaqa
  max_index_docs: 20000
- name: natural_questions
  max_index_docs: 20000
- name: chatdoctor
  max_index_docs: 20000
- name: searchqa
  max_index_docs: 20000
  max_test_queries: 40
- name: medical_dirichlet_phi3
  max_index_docs: 20000
  max_test_queries: 40
- name: movielens
  max_index_docs: 20000
  max_test_queries: 40
dataset:
  name: triviaqa
  max_index_docs: 20000
llm:
  name: huggingface
  model_name: facebook/opt-1.3b
llms:
- model_name: facebook/opt-1.3b
- model_name: Qwen/Qwen2.5-3B-Instruct
- model_name: meta-llama/Llama-3.2-3B-Instruct
- model_name: microsoft/Phi-3.5-mini-instruct
models:
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5
dpvoterag:
  truncate_at_double_slash: false
  m: 50
  k: 1
  epsilon_token_from_budget: true
  epsilon_token: 2
  delta_token_from_workload: true
  delta_token: 1.0e-06
  k_bar: 50
  compose_method: simple
  tmax_absolute: null
  max_length: 30
  fail_mode: stop
  exclude_stopwords: false
  exclude_question_words: false
  stopwords_path: data/stopword_words.pt
  random_seed: 42
  use_chat_template: auto
  stop_strings: null
delta_total: 0.01
k_retrieved: 50
metrics:
  utility:
  - match_accuracy
  - contains_accuracy
  - rouge_l
  - f1_score
  - bert_score_f1
  - perplexity
  privacy: []
output_dir: results/mia_dpvoterag/
max_queries: 40
verbose: true
verbose_max_examples: 5
chunking:
  enabled: false
  chunk_size: 256
  overlap: 32
  max_document_words: 400
epsilon_targets:
- 1
- 3
- 5
- 10
- 50
workload_queries:
- 1
- 5
- 25
- 100
mia:
  enabled: true
  n_per_class: 50
  index_size: 2000
  seed: 42
  anderson_doc_maxlen: 512
