# Mirrors full/ -- edit full/ and carry the change here.
method: private_rag
datasets:
- name: natural_questions
  max_index_docs: 20000
  max_test_queries: 40
- name: triviaqa
  max_index_docs: 20000
  max_test_queries: 40
- name: chatdoctor
  max_index_docs: 20000
  max_test_queries: 40
- name: searchqa
  max_index_docs: 20000
  max_test_queries: 40
- name: medical_dirichlet_phi3
  max_index_docs: 20000
  max_test_queries: 40
- name: movielens
  max_index_docs: 20000
  max_test_queries: 40
dataset:
  name: natural_questions
  max_index_docs: 20000
llm:
  name: huggingface
  model_name: facebook/opt-1.3b
llms:
- model_name: facebook/opt-1.3b
- model_name: Qwen/Qwen2.5-3B-Instruct
- model_name: meta-llama/Llama-3.2-3B-Instruct
- model_name: microsoft/Phi-3.5-mini-instruct
models:
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5
private_rag:
  variant: murag_ada
  M: 1
  truncate_at_double_slash: false
  m: 50
  k: 1
  epsilon_0: 2.0
  vote_threshold: null
  t_max: 30
  epsilon_thr_fraction: 0.1
  epsilon_thr: 1.0
  score_min: 0.0
  score_max: 0.85
  bin_size: 0.005
  exclude_stopwords: false
  exclude_question_words: false
  stopwords_path: data/stopword_words.pt
  random_seed: 42
  use_chat_template: auto
  stop_strings: null
epsilon_0_from_budget: true
epsilon_0_values:
- 0.5
- 1.0
- 2.0
k_retrieved: 50
metrics:
  utility:
  - match_accuracy
  - contains_accuracy
  - rouge_l
  - f1_score
  - bert_score_f1
  - perplexity
  privacy: []
output_dir: results/mia_private_rag_ada/
max_queries: 40
verbose: true
verbose_max_examples: 3
chunking:
  enabled: false
  chunk_size: 256
  overlap: 32
  max_document_words: 400
epsilon_targets:
- 1
- 3
- 5
- 10
- 50
workload_queries:
- 1
mia:
  enabled: true
  n_per_class: 50
  index_size: 2000
  seed: 42
  anderson_doc_maxlen: 512
