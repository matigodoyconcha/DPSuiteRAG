# Mirrors full/ -- edit full/ and carry the change here.
method: vanilla
datasets:
- name: chatdoctor
  max_index_docs: 20000
- name: natural_questions
  max_index_docs: 20000
- name: triviaqa
  max_index_docs: 20000
- name: medical_dirichlet_phi3
  max_index_docs: 20000
- name: searchqa
  max_index_docs: 20000
- name: movielens
  max_index_docs: 20000
mia:
  enabled: true
  n_per_class: 50
  index_size: 2000
  seed: 42
  anderson_doc_maxlen: 512
dataset:
  name: squad
  index_split: train
  test_split: validation
  max_index_docs: 20000
  max_test_queries: 40
  docs_path: null
  queries_path: null
llm:
  name: huggingface
  model_name: facebook/opt-1.3b
llms:
- model_name: facebook/opt-1.3b
- model_name: microsoft/Phi-3.5-mini-instruct
- model_name: meta-llama/Llama-3.2-3B-Instruct
- model_name: Qwen/Qwen2.5-3B-Instruct
models:
  embedder: Snowflake/snowflake-arctic-embed-m-v1.5
pipeline:
  k_retrieved: 50
generation:
  max_new_tokens: 30
  use_chat_template: auto
  stop_strings: null
random_seed: 42
output_path: results/vanilla/vanilla_squad.json
chunking:
  enabled: false
  chunk_size: 256
  overlap: 32
  max_document_words: 400
output_dir: results/mia_vanilla/
