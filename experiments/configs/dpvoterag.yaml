method: dpvoterag

dataset:
  name: natural_questions

llm:
  name: huggingface
  model_name: facebook/opt-1.3b

models:
  embedder: sentence-transformers/all-MiniLM-L6-v2

dpvoterag:
  m: 30
  k: 1
  epsilon_token: 2
  delta_token: 1.0e-5
  k_bar: 30
  random_seed: 42

epsilon_values: [5, 10, 20, 40]
delta_total: 1.0e-4
k_retrieved: 30

metrics:
  utility: [match_accuracy]
  privacy: [mia_auc_bleu]

output_dir: results/dpvoterag/
max_queries: 20
verbose: false
verbose_max_examples: 3
