method: vanilla

dataset:
  # Opciones soportadas: demo | squad | chatdoctor | natural_questions | triviaqa | hotpotqa
  name: squad

  # Como separar indexado y test
  index_split: train
  test_split: validation
  max_index_docs: 200
  max_test_queries: 25

  # If you want to control exactly the index documents and test queries,
  # you can use local files and skip the HuggingFace dataset:
  # docs_path: data/index_docs.jsonl
  # queries_path: data/test_queries.jsonl
  docs_path:
  queries_path:

llm:
  # name funciona como selector del proveedor/model loader, igual que dataset.name
  name: huggingface
  model_name: sshleifer/tiny-gpt2

models:
  embedder: sentence-transformers/all-MiniLM-L6-v2

pipeline:
  chunk_size: 120
  chunk_overlap: 20
  k_retrieved: 2

generation:
  max_new_tokens: 48

random_seed: 42
output_path: results/vanilla/vanilla_squad.json
